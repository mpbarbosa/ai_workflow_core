    Analyze ONLY the configuration files explicitly listed above. Do not reference, invent, or assume files not in that list.
    Treat `tsconfig*.json`, `jsconfig*.json`, and `.vscode/*.json` as JSONC-capable when comments are visible; do not report those comments as strict-JSON syntax errors.
    Do not recommend adding comments, READMEs, or rationale notes unless the visible configuration is genuinely opaque, risky, or missing explanation for a concrete maintenance-critical choice.
    If `.workflow-config.yaml` is in scope and a step's dependency set differs from the

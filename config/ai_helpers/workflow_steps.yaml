step1_5_copilot_instructions_prompt:
  role_ref: consistency

  behavioral_guidelines: *behavioral_actionable

  task_template: |
    **YOUR TASK**: Audit and correct `{copilot_instructions_path}` so it becomes a concise, durable, high-signal Copilot guidance file for the live repository.

    This is a repository authority file for Copilot-assisted development. Treat the current file as untrusted input: it may contain stale versions, duplicated reference material, overly broad project-handbook content, wrong file paths, or obsolete implementation claims.

    **Authoritative repo facts (highest priority — use these instead of trusting the current document):**
    --- BEGIN Authoritative Repo Facts (citable evidence only) ---
    {repo_facts}
    --- END Authoritative Repo Facts ---

    **Current file to correct**:
    ```markdown
    {copilot_instructions_content}
    ```

    **Required corrections**:
    1. Keep the file focused on guidance that directly improves Copilot's coding decisions for this repository.
    2. Preserve durable, project-specific guidance such as architecture boundaries, design principles, documentation-sync rules, and standard validation commands when they are supported by the repo facts.
    3. Remove or condense content that belongs in other owned docs: implementation status snapshots, numeric inventories, workflow or command lists, installation walkthroughs, migration details, and other broad reference-manual material.
    4. When detailed reference material is still useful, replace duplicated detail with short pointers to the authoritative documents instead of copying the full content.
    5. Rewrite any unsupported or stale claim conservatively instead of inventing details.
    6. If a project-specific detail is not explicitly supported by the authoritative repo facts block or by the visible current file content above, omit it or rewrite it in generic terms instead of presenting it as a verified repository fact.

    **Output format**:
    1. Start with `## Findings`.
    2. Under that heading, add one `### Finding N - <short title>` subsection for each concrete problem, omission, or explicit "no issue" decision that matters to the rewrite.
    3. Within each finding, include these bullets exactly:
       - `**Classification**`: `supported guidance` | `unsupported claim` | `stale detail` | `duplicate reference` | `inconclusive`
       - `**Current file evidence**`: cite the relevant section, line range, or state `none`
       - `**Repo-fact evidence**`: cite the supporting repo fact, or state `not available`
       - `**Action**`: `keep` | `rewrite` | `remove` | `omit pending evidence`
       - `**Why this matters**`: one sentence explaining the practical impact on Copilot guidance quality
       - If a finding value needs multiple lines or sub-bullets, continue them under the same labeled bullet; do not start the next `- **...**:` field until the current value is complete.
       - Use the enum values exactly as written; do not append parenthetical explanations or any extra prose to the `Classification` or `Action` bullets.
       - Mark a finding as `supported guidance` only when the `Repo-fact evidence` bullet cites a surfaced repo fact that explicitly supports the retained guidance; if support is missing, use `not available` and a non-supported classification instead.
       - When citing `Repo-fact evidence`, quote exact surfaced text, name the surfaced heading verbatim, or use a formatting-normalized equivalent of an exact surfaced snippet (for example without markdown backticks); do not paraphrase or summarize repo facts as if they were surfaced verbatim.
       - If one current-file section contains multiple distinct claims, split them into separate findings or classify the unsupported subset separately; do not classify the whole section as supported when only part of it is grounded.
       - If a `supported guidance` finding retains multiple repo-specific details, every retained backticked detail must be explicitly surfaced in the repo facts; when support is mixed, rewrite to the supported subset first, then split or downgrade the unsupported remainder.
       - A broad heading such as `Authoritative Reference Docs` or `Public Package Entry Points` is not enough by itself to support a different operational claim; cite the exact surfaced snippet that supports the retained claim, or split/downgrade the finding.
       - For entry-point, router, bootstrap, mount, or legacy-pipeline claims, cite the exact surfaced `Source Entry Signals` snippet rather than relying on package metadata or broad headings alone.
       - Do not emit findings for topics that are absent from the current file unless the omission itself is explicitly required by the task; `Current file evidence: none` is only valid for those explicit omission cases.
      4. If no corrections are needed, still include `## Findings` with a single finding that clearly says no issue was confirmed and why.
      5. After the findings, add `## Corrected File` followed by ONLY one fenced ```markdown block containing the full corrected replacement for `{copilot_instructions_path}`.
      6. Do not use additional fenced code blocks outside the final corrected-file block.

  approach: |
    **Editing methodology**:
    1. Start from the authoritative repo facts, not from the current document.
    2. First decide whether each section is:
       - still relevant to a Copilot guidance file,
       - worth condensing,
       - better extracted into an existing document and replaced with a pointer,
       - or redundant and removable.
    3. Prefer durable guidance over volatile reference data.
    4. Preserve useful markdown structure where it remains valid, but rewrite stale or oversized sections completely when needed.

    **Hard rules**:
      - Do NOT invent missing files, counts, commands, capabilities, or documents.
      - Treat ONLY the text inside `--- BEGIN Authoritative Repo Facts (citable evidence only) ---` and `--- END Authoritative Repo Facts ---` as citable `Repo-fact evidence`; task instructions, output rules, and methodology text are never citable evidence.
      - Treat the authoritative repo facts block and the current file excerpt above as the only visible evidence for repo-specific claims in this task.
     - Do NOT recreate exhaustive inventories, count summaries, release-status snapshots, or tutorial-style content inside the Copilot instructions file unless the repo facts clearly show they are essential to Copilot guidance.
      - Do NOT keep incorrect numeric or status claims when the repo facts disagree.
      - Do NOT introduce repository-specific implementation details, template syntax, helper modules, or workflow conventions unless they are explicitly stated in the repo facts block or literally visible in the current file content.
      - Do NOT cite invented repo-fact headings, labels, or document titles; quote exact surfaced snippets, surfaced headings, or formatting-normalized equivalents of exact surfaced snippets only when they are visibly present in the surfaced repo facts block.
      - Do prefer brief links or pointers to authoritative docs when detailed material already exists elsewhere in the repository.
      - If a concise repository description is directly corroborated by surfaced reference-doc titles or snippets, do not mark it unsupported solely because the full document is not reproduced in the prompt.
      - When pointing to authoritative docs, reference the relevant document set surfaced in repo facts; do not imply that `README.md` is the sole authority unless the repo facts explicitly show that.
      - When repo facts include both package metadata and `Source Entry Signals`, use the source-entry evidence as the authority for describing router/bootstrap/runtime entry behavior; use package entry points only for manifest-level claims.
      - Make every changed, removed, or intentionally retained suspicious section explicit in `## Findings`; do not rely on the corrected file alone to communicate what was wrong.
      - Each finding must map to a concrete section or claim from the current file, even when the action is "keep" or "omit pending evidence".
      - A finding whose current-file evidence says the file already avoids a problem is a meta observation, not a concrete issue; reserve the single no-issue finding for cases where the entire file is already acceptable and every retained claim is supported by surfaced repo facts.
      - If repo-fact support is absent, write `Repo-fact evidence: not available` exactly — no parentheticals, inline reasoning, or qualifications appended; do not substitute generic best practices, plausibility, or inferred project conventions as repo-fact support.
      - Do not treat an unchanged corrected file as proof that no issue exists; unchanged files may still require multiple concrete findings that explain why text was retained or why support remained inconclusive.
      - Do not emit meta-cleanliness findings like `No invented or unsupported details`; use the single no-issue finding only when the entire file needs no corrections.
      - Do NOT output a patch; the final fenced markdown block must be the complete corrected file.
      - If the current file contains broad historical claims that cannot be validated, replace them with wording grounded in the provided facts.
      - If a current-file statement looks plausible but the repo facts do not confirm it, prefer omission or more general wording over repeating it as a verified fact.

    **Final self-check before responding**:
      - Verify every `supported guidance` finding cites an exact surfaced repo-fact snippet, a surfaced heading, or a formatting-normalized equivalent of an exact surfaced snippet from inside the citable repo-facts block.
      - Verify no `Repo-fact evidence` bullet quotes task instructions, hard rules, or output-format text.
      - Verify mixed current-file sections are split when only part of the section is supported.
      - Verify `Current file evidence: none` appears only for the single no-issue finding or an explicitly required omission.
      - Verify unchanged corrected files use the single no-issue finding only when the entire file needs no corrections and every retained claim is supported by surfaced repo facts.
      - Verify every `Classification` and `Action` bullet uses an allowed enum value with no extra prose.

step2_consistency_prompt:
  # Split role into prefix + guidelines for token efficiency
  role_ref: step2_consistency  # resolved from config/prompt_roles.yaml
  
  behavioral_guidelines: *behavioral_structured
  
  task_template: |
    Perform a comprehensive documentation consistency analysis for this project,
    covering **markdown documentation files** (`.md`) only. "Consistency" means:
    uniform naming conventions, up-to-date examples and version numbers (including
    version badges), intact cross-references, and style uniformity across all
    documentation types (e.g., consistent heading levels, bullet list styles, and
    fenced code-block language tags — for example, one file calling a concept
    "auto-commit" while another calls it "autocommit" is a consistency violation).
    Where project-specific conventions are documented — in particular
    `.github/copilot-instructions.md` and `CONTRIBUTING.md` — treat only the files
    that are present in the project and available in the provided context as
    authoritative style references, and let them take precedence over generic
    defaults. If `.github/copilot-instructions.md` is missing or unavailable, use
    `CONTRIBUTING.md` alone as the project-specific authority when it is available.
    If either file is missing, unavailable, or too incomplete to settle a convention,
    explicitly note that gap in your analysis, then fall back to widely accepted
    generic markdown best practices (e.g., ATX-style headings, consistent
    capitalisation within heading levels) for any undefined conventions. For
    example, if `README.md` uses `## Quick Start` while another documentation file
    in the provided scope uses `## Quick start`, treat that heading-style mismatch
    as a consistency issue.

    **Context:**
    - Project: {project_name}
    - Project Summary: {project_summary}
    - Primary Language: {primary_language}
    - Total documentation files in project: {doc_count} markdown files
    - TypeScript source files: {ts_source_count} (not included in this partition — JSDoc source coverage is checked in the TypeScript Review step)
    - Canonical package version detected by the workflow: {expected_version}
    - Change Scope: {change_scope} (changed file categories in this run, not project architecture)
    - Files in this analysis batch: {modified_count}
    - Documentation scope: the markdown files explicitly listed below, including root-level docs (e.g., `README.md`, `CHANGELOG.md`), any `docs/` subtree entries when present, and any markdown files under `.github/` when present — other hidden directories, hidden tool directories (`.workflow_core/`, `node_modules/`), archived snapshots (e.g., `.ai_workflow/archive/`), and build outputs (`dist/`, `coverage/`) are excluded unless explicitly listed in the files below; auto-generated `.md` files should be flagged when they contain consistency violations but treated as **lower priority** than hand-authored docs, since they are regenerated on each build. Generated documentation copies should be treated as standalone scope items only when they are explicitly listed and their excerpts are visible.
    - Files referenced in markdown tables, numbered lists, or inline links but absent from the file list are **not automatically in scope** for content-level comparisons in a partitioned run — treat them as broken-reference candidates or potential documentation gaps only when the reference itself is visible, and keep the root cause unverified from visible context unless the target or a more specific explanation is also visible
    - Repo-wide markdown inventory (existence evidence only, not content evidence):
      {repo_wide_doc_inventory}
    - Ignore non-markdown documentation sources outside the listed markdown files — such as repository source comments, standalone JSDoc in source files, YAML, JSON, or generated config files — unless they appear inside the markdown files under review as embedded examples/snippets
    - The complete list of files in scope for this partition is provided at the end of this prompt in the **Files to Analyze** section.

    **Provided file contents and excerpts (authoritative for content-level claims):**
    {file_contents}
    - Some excerpts may be truncated, omitted, or unavailable. Treat those markers as hard evidence limits: cite only the visible text, and mark any partition-wide or file-wide conclusion that depends on omitted content as limited or inconclusive. For every limited or inconclusive conclusion, state exactly which missing file, excerpt, or authoritative source prevented confirmation.
    - Canonical version evidence available to the workflow even when `package.json` is not excerpted in this partition:
      {canonical_version_evidence}
    - Compare this canonical version only against visible current-state package/document version claims or version badges; do **not** treat historical markers such as `Since:`, `Upstream package version:`, or `Documentation snapshot:` as package-version mismatches.
    - If a visible current-state version claim differs from the canonical version, do **not** conclude "No version mismatch detected" unless the same visible excerpt also makes it clear that the document is archival or historical context rather than current-state guidance.
    - Treat cues such as `Status: Archived`, `Status: Deprecated`, `Historical`, `Archived document`, archive-style paths, or explicit "as of <date>" snapshot framing as historical drift indicators; when those cues are visible, prefer "historical drift" or lower-priority handling over a current-state version mismatch.
    
    **Tasks:**
    
    1. **Cross-Reference Validation:**
       - Check if all referenced files/directories exist
       - Verify version numbers follow semantic versioning (MAJOR.MINOR.PATCH)
       - Ensure version consistency across documentation and package manifests
         (check `package.json`, `package-lock.json`, and ecosystem-equivalent lockfiles)
         only when those files or their relevant contents are explicitly visible in the provided context;
         otherwise mark that comparison as limited or inconclusive and do not contradict the programmatic scan
        - Validate command examples match actual scripts/executables:
          npm/yarn scripts defined in `package.json`; automation scripts in `scripts/` or
          `bin/` (check all formats present — `.sh` shell scripts, `.js`/`.ts` Node.js
          scripts, Python scripts, or other executables — skip format-specific checks for
          types absent from the repository); and any executables referenced in README or
          CONTRIBUTING. "Documentation quality" for scripts means: inline comments
          explaining non-obvious logic, a usage example or `--help` reference in an
          adjacent README, and accurate descriptions in the root `scripts/README.md`
          (if present). If the relevant manifests or script files are not visible in the
          provided context, mark the check as limited or inconclusive rather than assuming
          the commands exist or match.
        - Do **not** treat a documented command as mismatched merely because its executable
          name does not appear in the visible markdown file list. Commands may refer to
          external CLIs, package-manager binaries, or tools outside the listed docs; only
          flag a command mismatch when visible manifests, scripts, or file contents
          contradict the documented usage.
    
    2. **Content Synchronization:**
       - Compare the primary documentation files present in the provided context:
         `README.md`, any `.github/copilot-instructions.md`, any architecture or
         requirements documents, and any `CONTRIBUTING.md` / `CHANGELOG.md` present
       - Check if module/component docs match actual code structure; use API,
         requirements, or architecture docs only when those files are actually present
         in the provided context, otherwise rely on inline documentation evidence only
       - Verify build/package configuration matches documented commands only when the
         supporting manifests, configs, or script files are explicitly visible in the
         provided context; otherwise mark the comparison as limited or inconclusive
    
    3. **Architecture Consistency:**
       - Validate directory structure matches documented structure; use the
         architecture document provided in this analysis batch as the primary source
         of truth, or a "Directory structure" section in `README.md` if no separate
         architecture document is present
       - Check if deployment/build steps match actual scripts
       - Verify dependency references are accurate
    
    4. **Broken Reference Root Cause Analysis:**
    
       The following broken links were detected by automated checks.
       Each entry is formatted as `source_file:line_number → broken_target_path`.
       Example: `README.md:15 → docs/getting-started.md` means line 15 of `README.md` links to `docs/getting-started.md`, which does not exist.
        These entries are scan-time candidates from automated checks. Treat them as a starting
        point for evidence-based review, not as proof of root cause. The SOURCE files all exist;
        the TARGET failed automated resolution at scan time. Some entries may also include
        an `existing repo path: ...` hint when the raw target matches another visible path
        in the repository; treat that hint as concrete evidence of a likely relative-path
        mistake or scan-resolution issue, not as an unverified absence. Some entries may
        also include a `related repo docs: ...` hint when similarly named markdown files
        exist elsewhere in the repository; treat that hint as grounded evidence of likely
        rename/move/path drift that must be investigated before calling the target missing.
        If the target path is absent from both the provided file list and the repo-wide markdown inventory and no `existing repo path`
        hint or visible target excerpt confirms what happened, classify the item as
        **Unverified From Visible Context** rather than **Confirmed Broken**. Reserve
        **Confirmed Broken** for cases where the visible evidence proves the target is wrong,
        missing, or mismatched.
        {broken_refs_content}
    
       **Your task**: For each `source:line → target` entry, perform systematic root cause analysis on the MISSING TARGET. Use the **Output Format** template at the end of this section for each entry.
    
        **Analysis Framework** (apply to each entry):
     
         a) **False Positive Check**: Is the target truly missing or a false positive?
            - Non-link syntax inside fenced code blocks or inline code (for example regex literals, glob patterns, placeholders, or sample strings) is **not** a broken file target unless the visible markdown syntax makes it an actual link/reference
            - If the candidate appears inside a visible fenced code block, inline code span, or sample snippet and the visible markdown does not make it an actual link, classify it as **False Positive** and recommend no action; do **not** leave it as unverified or suggest placeholder cleanup
            - Generated files (build artifacts, coverage reports, compiled outputs)
            - External URLs (may be temporarily unavailable but valid)
            - Intentional references (placeholders, future files, templates)
            - Case-sensitive path issues (Linux vs macOS/Windows)
            - Resolve the target relative to the source file's directory before deciding whether it is missing; nested docs often use links like `api/foo.md`, `../README.md`, or `guides/FAQ.md` that are meaningful only after source-relative resolution
            - If that source-relative resolved path already appears in the visible file list, treat the issue as a relative-path mistake or scan-resolution issue and name that exact path in the root cause; do **not** claim the target is absent from the file list
        - If a candidate entry explicitly includes an `existing repo path: ...` hint, use that path as grounded repo evidence and classify the issue as a relative-path mistake or scan-resolution issue instead of leaving it unverified
        - If a candidate entry explicitly includes a `related repo docs: ...` hint, treat those paths as rename/move candidates backed by repo inventory and investigate path drift before classifying the target as missing
        - Treat an `existing repo path: ...` hint as proof that the raw target is not simply "missing", but not automatically as the final replacement path; if the visible link label, nearby visible docs, or source-directory context clearly point to a more plausible destination, recommend that more specific source-relative correction instead of a repo-root shortcut
        - Preserve any `existing repo path: ...` hint verbatim when a retry block repeats a candidate; the hint remains grounded evidence on retries too
        - Targets that are simply absent from the current partition's visible file list or excerpts are **not**
          automatically confirmed missing in the live repository; if the current prompt does not include
          enough repo-wide evidence to resolve the target, mark the item as unverified rather than inventing
              a root cause

           If false positive: Document why and recommend no action.
    
       b) **Root Cause Determination**: If truly missing, what caused it?
          - **Renamed file**: File exists but at different name
          - **Moved location**: File exists but in different directory
          - **Typo in reference**: Reference has spelling/path error
          - **Removed intentionally**: File deleted as part of refactoring
          - **Never existed**: Reference added incorrectly
          
          Document the specific cause with evidence. If the visible mismatch is clearly explained by archive, deprecation, or snapshot framing, classify it as **Expected Historical Drift** instead of a current-state defect.
    
         c) **Fix Recommendation**: What's the specific fix?
            - **Update reference**: Change path/filename to correct location
              Example: `docs/old.md` → `docs/new.md`
          - **Restore file**: Recreate deleted file if still needed
            Example: Restore `docs/missing-guide.md`
          - **Remove reference**: Delete obsolete link
            Example: Remove link to deprecated feature
          - **Create missing file**: Add new file if reference is intentional
            Example: Create placeholder `docs/future-feature.md`
           
            Provide before/after examples for each fix.
            If the visible context shows an existing destination file, recommend the exact **source-relative** replacement path that should appear in the source file; never suggest a repo-root-looking path for a nested source file
            If the target is only absent from the visible context and the correct fix cannot be determined from
            the prompt evidence, keep the item **Unverified From Visible Context** and recommend follow-up confirmation rather than defaulting to "create the file", "create the directory", or a guessed replacement path.
    
       d) **Priority Assessment**: What's the impact and urgency?
          - **Critical**: User-facing docs (README, getting started, installation)
          - **High**: Developer docs (API reference, architecture, contributing)
          - **Medium**: Internal docs (design decisions, meeting notes)
          - **Low**: Archive docs (historical, deprecated, legacy)
          
          Consider: How many users affected? Does it block usage? Is it discoverable?
     Note: If the target file is not visible in the provided context (e.g., due to context truncation), assess priority based on the target file's intended audience rather than its content.
    
        **Output Format for Each Reference**:
        
        ### Reference: [file.md:line] → [target]
        - **Status**: [False Positive / Confirmed Broken / Unverified From Visible Context]
        - **Root Cause**: [Specific cause with evidence]
        - **Recommended Fix**: [Specific action with example]
        - **Priority**: [Critical/High/Medium/Low] - [Justification]
       - **Impact**: [Who is affected and how]
    
     5. **Quality Checks:**
        - Missing documentation for new features
        - Incomplete documentation (sections present but sparse or stub-level): flag at
          Medium priority, identify the specific visible gaps, and do not fabricate content to fill them
        - Do **not** report a file as sparse, stub-level, or incomplete unless the visible
          file contents show the missing sections, missing examples, or missing cross-links
          that justify that conclusion; otherwise mark the check inconclusive and omit it
          from the summary table
        - When a non-broken-link finding is better explained by archive, deprecation, or
          snapshot cues, label it **Expected Historical Drift** and lower its priority
          instead of presenting it as a current-state defect
        - Absent documentation (no file exists for a known component, workflow, or feature):
          flag at High or Critical priority depending on audience impact, and recommend
          creating a placeholder or stub file with the expected structure
       - Outdated version numbers or dates (only flag if the file already carries explicit
         version numbers; do not invent or assume versioning where none is present)
       - Version badge discrepancies — when a file contains version badges (e.g.,
         `![version](https://img.shields.io/badge/version-X.Y.Z-...)`) or status badges
         with an embedded version string, compare the badge version against the
         authoritative version sources visible in the provided context (e.g., `package.json`
         version field); flag only if an explicit version mismatch is detectable from the
         provided context — do not flag badges whose version cannot be verified
        - Missing referenced documentation files — flag markdown tables, numbered lists,
          or inline links that reference a documentation file by path or name that does not
          appear in either the provided file list or the repo-wide markdown inventory; treat these as documentation gaps, not broken
          links (broken links are already handled by the programmatic scan above)
        - Inconsistent terminology or naming conventions — flag when the same concept is
          referred to by different names across files
          (e.g. a component called "ListPanel" in one doc and "List Panel" in another)
        - When claiming a preferred project term (for example from
          `.github/copilot-instructions.md` or `CONTRIBUTING.md`), cite the exact visible
          line that establishes that preference; if no explicit preference is visible,
          report only the observed inconsistency and do not attribute a canonical term
        - Missing cross-references between related docs — flag when a concept, component,
          or module is documented in one place but not linked from a closely related file
          (e.g. `README.md` mentions a component without linking to a more detailed
          documentation file that is present in the provided context)
    
    6. **Inline Documentation Scope:**
       - Do **not** assess source-file JSDoc completeness in this step.
       - Mention inline JSDoc/TSDoc only when a visible markdown excerpt in this partition
         contains such a snippet and the snippet itself is inaccurate or inconsistent.
       - Otherwise leave inline documentation out of the report; the TypeScript Review
         step owns source-file JSDoc completeness.
    
    **Files to Analyze:**
    {doc_files}
  
  approach: |
    Analyze ONLY the documentation files and broken references explicitly listed above. Do not invent file paths, version numbers, or cross-references not present in the provided context.

     **Output:**
     - Recommendations for fixes with rationale
     - Priority level (Critical/High/Medium/Low) for each issue
     - Actionable remediation steps
      - Explicitly note any conclusions that are limited or inconclusive because the
        relevant files, comments, or configuration are not visible in the provided context
      - For every limited or inconclusive conclusion, state exactly which missing file,
        excerpt, or authoritative source prevented confirmation
      - When archive, deprecation, or snapshot cues explain a non-broken-link finding,
        label it **Expected Historical Drift** instead of presenting it as a current-state defect
       - If no additional semantic issues are supported by the visible file contents, say exactly:
         "No additional issues found beyond the programmatic scan."
        - Do not replace that statement with broader claims like "all documentation is consistent"
          unless the visible file contents support that conclusion directly
        - If you use the exact sentence "No additional issues found beyond the programmatic scan.",
          do not append unsupported pass claims after it; either stop there or keep any
          remaining checks explicitly limited or inconclusive
        - Do not claim that no version numbers or badges are present unless the relevant
          in-scope files or excerpts needed to support that absence are actually visible in the
          prompt or already established by the programmatic scan
        - Do not claim heading, list, or code-fence consistency across files unless the exact
          supporting headings, list items, or fenced blocks are visible for each compared file;
          otherwise keep the claim scoped to the visible excerpts or mark it inconclusive
         - Do not claim missing-documentation, missing-cross-reference, or stub-level checks
           passed merely because a file name appears in the file list; require visible file
           content or mark the check inconclusive
         - Do not classify a referenced documentation file as missing merely because it is
           absent from the current partition file list when the repo-wide markdown inventory
           shows it exists elsewhere in the repository
         - Treat off-list referenced files as candidate targets, not additional in-scope
           documents, unless their own contents are also visible in the provided context
         - Unlabelled fenced blocks are not automatically inconsistent; only report a code-block
           language-tag issue when the exact visible block and a visible project convention
           support that conclusion
       - If any requested comparison remains limited, truncated, partitioned, or otherwise inconclusive,
          keep the summary scoped to the visible evidence and explicitly say the remaining checks are
          inconclusive rather than implying exhaustive validation
       - Do not write negative pass findings such as "No visible inconsistencies", "No evidence of mismatched terminology", or "No missing cross-references detected" unless the exact compared artifacts are visibly supported; otherwise phrase the remaining check as limited or inconclusive
       - If a file path appears in the provided file list but its content is omitted or truncated, do not say the file or section is "not visible"; describe the comparison as unavailable from the visible excerpt instead
        - Do not claim overall consistency with package manifests, scripts, build steps, or
          source code unless that supporting evidence is explicitly visible in the provided context
        - Do not treat a documented command as unsupported merely because the command name is
          absent from the visible markdown file list; commands may refer to external CLIs or
          package binaries unless visible manifests, scripts, or file contents contradict them
        - Do not project a finding from a generated documentation copy onto a hand-authored
          source document unless both paths are explicitly visible in the provided context

    **Documentation Standards to Apply:**
    - Technical accuracy and precision
    - Consistency in terminology and formatting
    - Completeness of cross-references
    - Version number accuracy across all files
    - Project-specific conventions: when `CONTRIBUTING.md` or `.github/copilot-instructions.md`
      is present in the provided context, align recommendations with those conventions and
      let them take precedence over generic defaults

    **Tooling Note:** Do not cite specific tool rule identifiers (e.g., markdownlint MD013,
    yamllint rule names) unless the tool configuration file is visible in the provided context.
    Cite the documented practice or standard instead.

     **Language-Specific Standards:** {language_specific_documentation}
      
      Please analyze the documentation files and provide a detailed consistency report
      based only on the provided context. When relevant documentation evidence is missing
      or outside the visible context, state that clearly and mark the affected conclusions
      as limited or inconclusive rather than inferring compliance. Do not cite terminology,
      version badges, heading-style mismatches, or inline JSDoc/TSDoc evidence unless the
      exact supporting text is visible in the provided file contents above.
      Do not classify regex fragments, placeholders, or other non-link tokens from code
      examples as broken references, and do not promote tentative phrases such as "may be
      sparse" into actionable findings or summary-table entries.
      Resolve every broken-reference candidate relative to its source file before you infer a root
      cause or propose a fix. For example, from `docs/developers/ONBOARDING.md`, the target
      `api/PROJECT_KINDS_SCHEMA.md` resolves to `docs/developers/api/PROJECT_KINDS_SCHEMA.md`;
      if the visible file list instead contains `docs/api/PROJECT_KINDS_SCHEMA.md`, diagnose the
      problem as an incorrect relative link and recommend the exact relative correction
      (`../api/PROJECT_KINDS_SCHEMA.md`) rather than adding a redundant `docs/` prefix.
      Do not explain a broken-reference candidate by saying only that the target "is not present
      in the provided context" when the current partition may be incomplete; either cite visible
      evidence of the actual root cause or mark the item as unverified from visible context.
      Do not end with blanket statements that imply complete validation when any requested check
      stayed limited or inconclusive; keep the conclusion narrowly scoped to the evidence that was
      actually visible.

# Step 3: Shell Script Reference Validation Prompt Template
step3_script_refs_prompt:
  # Split role into prefix + guidelines for token efficiency
  role_ref: step3_script_refs  # resolved from config/prompt_roles.yaml
  
  behavioral_guidelines: *behavioral_structured
  
  task_template: |
    Perform comprehensive validation of automation script references and documentation quality for this project's scripts and executable entrypoints.
    
    **Context:**
    - Project: {project_name}
    - Project Summary: {project_summary}
    - Primary Language: {primary_language}
    - Project Kind: {project_kind}
    - Script Directories: {scripts_dir}
    - Script File Patterns: `*.sh`, executable shell entrypoints, `bin/` entrypoints, and documented command examples that invoke the listed scripts
    - Total Scripts: {script_count}
    - Change Scope: {change_scope} (changed file categories in this run, not project architecture)
    - Modified Files: {modified_count}
    - Issues Found in Phase 1: {issues}
    
    **Phase 1 Automated Findings:**
    {script_issues_content}

    {doc_coverage_heading}
    {doc_coverage_map}
    {doc_coverage_guidance}
    If a coverage entry is annotated as `path variant: ...` or `basename only: ...`, treat that
    as weaker evidence than an exact path match. Do not mark the script as cleanly documented
    until the visible invocation form and repository-root context agree with the scoped path.
    For a root-level script (for example `cdn-delivery.sh`), the bare filename is the exact
    repository-relative path, not a basename-only ambiguity.

    **Scripts in Scope (authoritative — analyze only these paths; do not infer or include any additional scripts):**
    {all_scripts}

    > Note: If no scripts appear above (Total Scripts: 0), confirm their absence in your report
    > and limit the analysis to broken or obsolete documentation references to scripts or entrypoints.
    > If scripts are listed but none of them are shell scripts, continue the analysis for those
    > non-shell automation entrypoints instead of treating this step as not applicable.
    > If a documentation file mentions a script or executable entrypoint that is not listed above or does not exist
    > on disk, report it explicitly as a missing, obsolete, or broken reference.
    > Apply shell-specific checks only to shell scripts in scope. For non-shell scripts, validate the
    > documentation against the actual invocation model and runtime expectations for the listed files.

    **Documentation Quality Criteria:**
    - Clear purpose statement for each script or executable entrypoint
    - Accurate command syntax and usage examples
    - Documented arguments, flags, and expected inputs
    - Documented prerequisites, dependencies, and required environment variables
    - Documented outputs, side effects, and exit/error behavior where relevant
    - Accurate references to related workflows, CI jobs, containers, or docs that invoke the script

    {doc_context_heading}
    {doc_context}
    {doc_context_guidance}

    **Tasks:**
    
    1. **Script-to-Documentation Mapping:**
       - Verify every script in the authoritative list above is documented in a relevant README, script reference, or workflow documentation
       - Check that documented scripts and entrypoints actually exist at the specified paths
       - Validate script descriptions match actual functionality
       - Ensure usage examples reference the correct script path and invocation form
    
     2. **Reference Accuracy:**
        - Validate documented command-line arguments, flags, and invocation form match the implementation
        - Check version numbers are consistent across documentation
        - Verify cross-references between scripts, related workflows, and documentation are accurate
        - Validate script path references in code comments and documentation
        - When docs mention a script through a different root prefix (for example `.workflow_core/scripts/foo.sh`
          vs `scripts/foo.sh`), report the path-context mismatch or ambiguity instead of claiming a clean pass
    
     3. **Documentation Completeness:**
       - Missing purpose/description for any script in scope
       - Missing usage examples or command syntax
       - Missing prerequisite, dependency, or environment-variable information
       - Missing output, side-effect, or exit-code documentation when the script behavior makes it relevant
    
      4. **Script Best Practices (Project-Specific):**
       - Executable permissions and invocation expectations documented where relevant
       - Shell-specific expectations (shebangs, shell invocation requirements, executable bits) checked only for shell scripts in scope
       - Runtime requirements for non-shell entrypoints documented where relevant
       - Environment variable requirements, error handling, and exit behavior documented where relevant
    
      5. **Integration Documentation:**
       - Workflow relationships involving the scripts in scope are documented
       - Execution order or dependencies between those scripts and surrounding automation are clarified
       - Common usage patterns and examples are provided
       - Troubleshooting guidance is available when the script is user-facing or operationally important
    
      6. **DevOps Integration Documentation** (when applicable):
       - CI/CD pipeline references only when they directly invoke or depend on a script in scope
       - Container/orchestration references only when they directly invoke or document a script in scope
       - Deployment, monitoring, or release automation references only when they directly point to a script in scope
    
    **Files to Analyze:**
    - Project README.md and any module/component README files that reference the scripts in scope
    - The scripts listed above (authoritative scope)
    - `.github/copilot-instructions.md` when it references the scripts in scope
    - Configuration or workflow files only when they define, invoke, or document one of the scripts in scope
    - CI/CD files, Dockerfiles, or compose/manifests only when they directly invoke one of the scripts in scope
  
  approach: |
    Analyze ONLY the scripts explicitly listed under "Scripts in Scope" above. Do not reference, invent, or assume the existence of any scripts not in that list.
    Treat that list as the complete authoritative scope even when it mixes shell scripts with Node.js, TypeScript, Python, or other executable entrypoints.
    If no scripts are listed, restrict the report to confirming their absence and identifying any broken or obsolete script references that appear in the provided documentation context.
    If scripts are listed but none are shell scripts, continue evaluating those automation entrypoints and skip shell-specific checks that do not apply.
    When the documentation content section is marked partial or includes truncation markers, keep claims scoped to the visible text. Do not state that every script lacks usage examples, arguments, or troubleshooting guidance unless those conclusions are supported by either a complete coverage map or explicit full-document evidence.
    If Phase 1 reports broken or missing references but the visible evidence does not show which exact paths are affected, keep the finding at count-level and mark the per-path detail as unavailable instead of inventing a concrete script example.
    Treat README command examples, command tables, automation-script sections, and dedicated guide links as valid forms of documentation when they are visible in the provided excerpts.
    If CI/CD workflows, Dockerfiles, compose files, or manifests are not visible in the provided evidence, mark CI/container conclusions as unavailable or inconclusive rather than absent.
    Do not generalise from one or two weak matches to claims like "most scripts", "all scripts", or "no visible workflow documentation" unless the visible coverage map or excerpts show that count directly.
    Recommendation examples must preserve the script's visible interface. Do not invent placeholder flags, positional arguments, or "Arguments: None" blocks when the implementation shows a different invocation model or when the interface is not visible.
    When an issue table includes an Example column, quote a visible command, path, or interface from the provided excerpts when possible; otherwise write `(no visible example)` instead of inventing a command or flag.

    **Output:**
    - List of script reference issues with file:line locations
    - Missing or incomplete script documentation
    - Inconsistencies between code and documentation
    - Recommendations for improving script documentation
    - Priority level (Critical/High/Medium/Low) for each issue
    - Actionable remediation steps with examples
    - A closing coverage summary line such as `Summary: N scripts missing documentation references`
      when the visible evidence supports a reliable count; if the coverage map is incomplete,
      use a partial-count warning instead of presenting the number as exhaustive
    
    **Documentation Standards to Apply:**
    - Clear and concise command syntax documentation
    - Comprehensive usage examples for each script
    - Accurate parameter and option descriptions
    - Proper script and entrypoint documentation conventions
    - Integration and workflow clarity
    
    Please analyze the script references and provide a detailed validation report with specific recommendations for documentation improvements.

# Step 5: Directory Structure Validation Prompt Template
# Placeholder note: {language_specific_directory_standards} carries project-kind-level
# directory conventions (not strictly language-level, despite the name). It is populated
# from project_kinds.yaml ai_guidance.directory_standards for the resolved project kind.
# For the 'generic' kind or when kind is unknown, the placeholder is left empty.
step5_directory_prompt:
  # Split role into prefix + guidelines for token efficiency
  role_ref: step4_directory  # resolved from config/prompt_roles.yaml
  
  behavioral_guidelines: *behavioral_structured
  
  task_template: |
    Perform comprehensive validation of directory structure and architectural organization for this project.
    This Task section is self-contained: the authoritative definition of **required** directories/files and the explicit meaning of **contents match the documented purpose** are both included below in this same prompt block.
    Validation covers both **presence** and **content/structure**:
    - **Presence** = required directories/files exist. Treat a path as **required** only when that requirement is supported by `.workflow-config.yaml`, `project_kinds.yaml`, or project documentation explicitly visible in this prompt. If `project_kinds.yaml` is unavailable, missing the resolved project kind, or does not define a specific requirement, do not invent one from best-practice heuristics alone.
    - **Content/structure** = a directory's contents match its declared or documented role (for example, source directories contain source files, test directories contain test files, and docs directories contain documentation files).
    - Best-practice conventions that are not explicitly required by the visible evidence should be framed as recommendations, not as missing-directory defects.

    **Authoritative Validation Sources:**
    - `.workflow-config.yaml` (if present, use as the primary source of truth for required structure)
    - `package.json` and any prompt metadata that states the project version (use when visible to cross-check contemporaneous version declarations inside this prompt)
    - `project_kinds.yaml` project-kind guidance and defaults (typically sourced from `.workflow_core/config/project_kinds.yaml` for this workflow, or from equivalent project-kind guidance included in the visible prompt context)
    - Architecture and structural guidance documented in `README.md`, `INDEX.md`, `docs/ARCHITECTURE.md`, `CONTRIBUTING.md`, `.github/SKILLS.md`, and directory-local `README.md` / `INDEX.md` files when visible

    **"Required" Directory Definition:**
    When `.workflow-config.yaml` is present, the following keys define required directories/files:
    - `structure.source_dirs` → source code directories (e.g. `src/`) — must exist and contain source files
    - `structure.test_dirs` → test directories (e.g. `__tests__/`, `tests/`) — must exist and contain test files
    - `structure.docs_dirs` → documentation directories (e.g. `docs/`) — must exist and contain `.md` files
    - `structure.ui_dirs` → UI component directories — must contain component source files
    - `structure.css_dirs` → stylesheet directories — must contain `.css` files
    - `structure.static_assets` → specific asset files that must be present at their listed paths; parent-directory visibility does **not** satisfy a file-level static-asset requirement
    When `.workflow-config.yaml` is absent, fall back to `project_kinds.yaml` guidance for the resolved project kind when that guidance is available and specific enough to define a requirement.
    If `project_kinds.yaml` is missing, incomplete, or does not define the relevant requirement, fall back to language/framework defaults and any structural expectations explicitly documented in the visible project docs (e.g. `src/`, `test/`, `docs/` for TypeScript/Node.js projects).
    Example: treat `ai_guidance.directory_standards` and similar project-kind structure definitions as guidance only when they are actually present for the resolved kind; otherwise downgrade the point to a recommendation instead of a missing-directory defect.

    **"Contents match the documented purpose"** means:
    - `source_dirs` entries contain source code files (`.ts`, `.js`, `.vue`) — not build artifacts or data
    - `test_dirs` entries contain test files (`*.test.*` or `*.spec.*`)
    - `docs_dirs` entries contain documentation files (`.md`, `.rst`, `.txt`)
    - Any directory described in `README.md` or `docs/ARCHITECTURE.md` matches its stated purpose
    - Example: a directory described as "UI component library" should contain component files, not config files
    - Undocumented directories (absent from all documentation sources) are flagged for clarification, not treated as hard errors unless another visible source explicitly requires them

    **Context:**
    - Project: {project_name}
    - Project Summary: {project_summary}
    - Primary Language: {primary_language}
    - Project Kind: {project_kind}
    - Total Directories: {dir_count} (excluding build artifacts, dependencies, coverage)
    - Change Scope: {change_scope} (changed file categories in this run, not project architecture)
    - Modified Files: {modified_count}
    - Critical Directories Missing: {missing_critical}
    - Directories Not Matched in Scanned Docs: {undocumented_dirs}
    - Documentation Mismatches: {doc_structure_mismatch}
    
    **Phase 1 Automated Findings:**
    {structure_issues_content}
    Treat these automated findings as heuristics from the scanned documentation set, not as authoritative documentation defects. Re-check them against the visible excerpts before confirming any documentation issue.

    **Authoritative Config Evidence (visible file content):**
    {config_context}
    Treat `.workflow-config.yaml` and other config files here as authoritative evidence for which paths are required, but not as proof that those paths exist on disk. A path listed in config establishes a requirement; confirm presence only when the same path is also visible in the directory tree or another visible excerpt in this prompt.
    If a config block ends with `... [truncated]`, treat checks that depend on the omitted portion as unavailable or inconclusive instead of assuming the rest of the file matches the visible lines.
    If multiple contemporaneous artifacts shown in this prompt declare a version (for example prompt metadata, `.workflow-config.yaml`, `package.json`, or `README.md`), compare them and report a version mismatch when they disagree.
    
    **Current Directory Structure:**
    {dir_tree}

    **Documentation Files (visible content from README.md, INDEX.md, docs/ARCHITECTURE.md, CONTRIBUTING.md, `.github/copilot-instructions.md`, `.github/SKILLS.md`, and directory-local README / INDEX files when available; blocks may include explicit truncation markers):**
    {doc_context}
    Treat these files as the complete visible excerpts provided in this prompt, not as proof that the underlying source files were shown in full. When a file block has no truncation marker, you may treat that block as fully visible. When a block ends with `... [truncated]` or `... [excerpt truncated]`, limit claims to the visible portion and mark anything beyond it as unavailable or inconclusive. Do not rely on documentation content outside the visible files here, and do not claim "No documentation found", "X is undocumented", or "primary documentation does not describe Y" unless the relevant documentation sources are visible here and the visible text supports that conclusion.
    If the authoritative documentation files are absent from the prompt evidence, mark the documentation status as unavailable or inconclusive instead of asserting either a clean pass or a confirmed documentation defect.
    Treat visible directory trees, folder inventories, README files inside a directory, and visible files located under a directory as valid documentation evidence for that directory.
    A visible repository-layout inventory entry (for example in `INDEX.md`) is evidence that the listed directory exists and contains the listed files. Do not overstate that situation as "no documentation" for the directory or its contents.
    A visible excerpt from `docs/ARCHITECTURE.md`, `docs/API.md`, or another file under `docs/` is itself evidence that `docs/` is being used for documentation. Do not report `docs/` as undocumented when such an excerpt is already visible.
    Treat `.github/SKILLS.md` and similar repository inventories as valid documentation evidence for referenced Copilot skill directories and files when those paths are visibly listed.
    If the directory tree contains an explicit truncation marker (for example `... [truncated: ...]`), treat paths absent from the visible tree as unknown rather than missing unless another visible excerpt confirms the absence or presence claim.
    If a visible file block is incomplete before a directory inventory completes, do not use that partial file block to claim later entries in the same inventory are undocumented or absent.
    For file-level checks such as `structure.static_assets`, require the **exact file path** to be visible in the prompt evidence before marking it present. A visible parent directory is not enough. Do not write phrases such as "present or the parent directory is."
    Do not make clean-pass claims for checks like misplaced config/build files or absent architectural violations unless the prompt includes enough visible file-level evidence to support them. Otherwise mark those checks as unavailable or inconclusive.
    
    **Tasks:**
    
    1. **Structure-to-Documentation Mapping:**
       - Verify directory structure matches documented architecture (presence check)
       - Check that primary documentation describes actual structure (content check)
       - Validate directory purposes are clearly documented
       - Ensure new directories have documentation explaining their role
    
    2. **Architectural Pattern Validation:**
       - Assess if directory organization follows language/framework best practices
       - Validate separation of concerns (src/, lib/, tests/, docs/, etc.)
       - Check for proper resource organization (assets, configs, data)
       - Verify module/component structure is logical and documented
    
    3. **Naming Convention Consistency:**
       - Validate directory names follow consistent conventions
       - Check for naming pattern consistency across similar directories
       - Verify no ambiguous or confusing directory names
       - Ensure directory names are descriptive and self-documenting
    
    4. **Best Practice Compliance:**
       {language_specific_directory_standards}
       - Source vs build output directory separation
       - Documentation organization (docs/ location and structure)
       - Configuration file locations (conventional paths)
       - Build artifact locations (proper gitignore coverage)
    
    5. **Scalability and Maintainability Assessment:**
       - Directory depth appropriate (not too deep or too flat)
       - Related files properly grouped
       - Clear boundaries between modules/components
       - Easy to navigate structure for new developers
       - Potential restructuring recommendations
  
  approach: |
    Analyze ONLY the directories explicitly listed under "Current Directory Structure" above. Do not reference, invent, or assume the existence of any directories not present in that list, and do not rely on documentation content outside the visible excerpts provided in this prompt.
    Do not report a directory as missing unless the visible evidence in this prompt makes it required. Config may establish that a path is required without proving it is present; if a required path is not visible in the directory tree and not otherwise shown in the excerpts, mark the presence check as unavailable or inconclusive instead of assuming either success or failure. If a convention suggests a directory would be beneficial but the prompt does not establish it as required, present that as a recommendation instead of a defect.
    If config or another authoritative source makes a path required, do not omit that requirement from your analysis just because the path is not visible in the directory tree. List it and mark the presence result as `Inconclusive` / `Unavailable` when visibility is insufficient.
    Do not state that a directory is undocumented, or that the primary documentation fails to describe it, unless the relevant README/architecture/contributing excerpts are visible and support that conclusion. Otherwise mark the documentation result as unavailable or inconclusive.
    Treat automated "undocumented" findings as provisional. If the excerpts show a repository inventory, directory-local README/INDEX file, a visible file excerpt under that directory, or any other concrete structure evidence for that directory, downgrade the point to clarification-needed unless the visible text clearly shows a real documentation gap. A shared index such as `.github/SKILLS.md` or a directory-level README counts as documentation evidence for the listed subdirectories.
    If multiple contemporaneous version declarations inside this prompt disagree, report that mismatch explicitly instead of summarizing the review as a clean pass.
    Do not make clean-pass claims such as "no misplaced config or build files detected" or "no architectural violations detected" unless the prompt includes enough visible file-level evidence to support that conclusion. If the prompt only shows directory names or partial excerpts, mark those checks as unavailable or inconclusive instead.
    Treat every `structure.static_assets` entry as a file-level requirement. If the exact asset path is not visible in the prompt evidence, mark that asset check as inconclusive even when its parent directory is visible.
    Do not recommend adding build artifacts such as `dist/` to `.gitignore` unless the visible prompt evidence explicitly shows both the artifact path and the current ignore policy. Some repositories intentionally commit generated outputs.
    If any required check remains unsupported, say so explicitly with `Inconclusive` / `Unavailable` wording and do not collapse it into an overall success statement such as "all required directories/files are present."

    **Output:**
    - List of structure issues with specific directory paths
    - Documentation mismatches (documented but missing, or undocumented but present)
    - Architectural pattern violations or inconsistencies
    - Naming convention issues
    - Best practice recommendations
    - Priority level (Critical/High/Medium/Low) for each issue
    - Actionable remediation steps with rationale
    - Suggested restructuring if needed (with migration impact assessment)
    
    Please analyze the directory structure and provide a detailed architectural validation report.

# Step 6: Test Implementation Review Prompt Template
# Test Implementation Prompt - Tactical Test Code Review and Quality Assessment
# Use for: Workflow Step 5, reviewing test code quality, test structure, implementation details
# Focus: HOW tests are written, code quality, best practices, refactoring opportunities
# NOT for: Strategic planning, coverage gap analysis, test prioritization (use test_strategy_prompt)
step6_test_review_prompt:
  # Split role into prefix + guidelines for token efficiency
  role_ref: step5_test_review  # resolved from config/prompt_roles.yaml
  
  behavioral_guidelines: *behavioral_actionable
  
  task_template: |
    Review the {test_framework} test file(s) and test-related artifacts listed in
    **Existing Test Files in Scope** below. Treat `{scoped_test_command}` as the
    best-matching test command for the scoped files and `{test_command}` as the
    repository-default command when they differ; neither is automatic proof that
    every listed file runs under that command. Some listed files may be
    declarative fixtures, test-adjacent artifacts, or require a different
    suite/configuration discovered during the filesystem scan.
    Provide tactical, code-level recommendations for improving test quality.

    > **Tactical recommendations** are concrete, file-level suggestions — e.g., rename
    > a vague test name to describe expected behavior, extract repeated setup into
    > `beforeEach`, replace `expect(arr.length).toBe(3)` with
    > `expect(arr).toHaveLength(3)`, add an edge case for null input, or remove
    > redundant assertions. Focus on HOW tests are written, not WHAT to test.

    **Context:**
    - Project: {project_name}
    - Project Summary: {project_summary}
    - Primary Language: {primary_language}
    - Change Scope: {change_scope}
    - Modified Files: {modified_count}
    - Test Framework: {test_framework}
    - Commands: best-matching scoped test command=`{scoped_test_command}`, repository-default test command=`{test_command}` (context only; not proof either executes every listed file), coverage=`{coverage_command}`
    - Total Discovered Test Files: {test_count} overall ({tests_in_tests_dir} under dedicated test directories `test/` or `__tests__/`, {tests_colocated} co-located alongside source files); this prompt reviews {scoped_test_count} file(s) listed below
    - Quality Criteria (project standards): AAA pattern, descriptive names, DRY fixtures, isolated tests, deterministic execution

    > **Note:** If the **Test Framework** above is a declarative/configuration format
    > (e.g., YAML, JSON, HCL) rather than a test runner, treat any such files as
    > fixture or config artifacts — focus recommendations on the executable test code
    > shown below. If no executable test definitions are provided in scope, explicitly
    > state that in your review instead of applying test-code advice.
    > If the visible file types or configuration imply that a different suite may be
    > needed, say that command compatibility is unverified from visible context
    > instead of assuming `{scoped_test_command}` or `{test_command}` executes the
    > scoped files.

    **Existing Test Files in Scope:**
    {test_files}

    {evidence_manifest}

    > **Evidence status key:**
    > - `full` — complete file content is provided; all conclusions are valid.
    > - `truncated` — visible portion only; conclusions about the visible code are valid,
    >   but execution-risk conclusions (CI compatibility, side effects, performance) are
    >   **inconclusive** for that file.
    > - `absent` — file content could not be included; all conclusions about that file
    >   are **unavailable** — do not invent or assume content.

    **Test Framework Configuration** (package.json, jest/vitest config, tsconfig — if available):
    {config_file_contents}

    **Project Context** (only if directly relevant and compact):
    {project_context_contents}

    **Test File Contents:**
    {test_file_contents}

    **Tasks:**

    1. **Test Code Quality Assessment** (e.g., naming clarity, structure, DRY violations):
       - Review test file structure and organization
       - Assess test naming conventions (describe behavior, not implementation)
       - Evaluate test readability and maintainability
       - Check for code duplication in tests (DRY violations)
       - Flag dead test helpers: for every helper function or fixture defined in the test file, verify it is referenced by at least one test case — unreferenced helpers are lint errors that block the next workflow run
       - Validate proper use of test framework features
       - Assess assertion quality (specific, meaningful messages)

    2. **Test Implementation Best Practices** (e.g., AAA pattern, mock hygiene, error paths):
       - Verify AAA pattern (Arrange-Act-Assert) usage
       - Check test isolation and independence
       - Review setup/teardown patterns and fixture usage
       - Validate mock usage (appropriate, not excessive)
       - Do not infer mock-call cleanup from `jest.resetModules()`, `jest.unstable_mockModule()`, or similar module-reset APIs alone
       - Assess async/await handling correctness
       - Check for proper error testing patterns
       - Do not label reroute/retry/race-condition/failure-handling scenarios as "happy path only" when the visible test body exercises those behaviors

    3. **Test Refactoring Opportunities** (e.g., parameterized tests, shared fixtures):
       - Identify verbose or complex test code
       - Suggest test helper function extractions
       - Recommend shared fixture improvements
       - Propose test data organization strategies
       - Identify opportunities for parameterized tests
       - Suggest removing redundant test cases

    4. **Test-Tooling Improvements** (e.g., better matchers/assertions, unused runner/framework features):
       - Recommend better matchers/assertions for clarity (where applicable)
       - Suggest framework features not being utilized (where applicable)
       - Recommend library-specific helpers or matchers only when that library is visible in imports, config, or package metadata included in the prompt
       - Identify anti-patterns specific to the test runner/framework
       - Propose modern testing patterns adoption
       - Check compatibility with framework version (where applicable)

    5. **Visible Execution-Risk Signals** (only when directly supported by the provided test code):
       - Identify explicit signs of slow or environment-sensitive tests (e.g., real fs/network/process calls, timers, shared global state, platform-specific assumptions)
       - Check for non-deterministic behavior only when the visible code shows it directly
       - Assess CI environment compatibility only when setup/teardown or assertions reveal concrete CI-sensitive assumptions
       - Recommend parallelization or execution optimizations only when the visible code demonstrates a bottleneck pattern
       - If the provided excerpts do not show direct evidence for these checks, mark them inconclusive instead of stating there are no issues
       - Do not add praise-only or "looks good overall" bullets in this section when no concrete risk is visible; use a single inconclusive note instead
   
  approach: |
    Analyze ONLY the test files explicitly listed above. Do not invent test files or
    assume a project structure that is not reflected in the provided context.

    Review each listed test file for code quality, best practices, and framework usage.
    Provide specific line-level feedback where applicable.

    **Output:**
    - Test code quality assessment with specific file:line references
    - Best practice violations with concrete examples
    - Refactoring recommendations with before/after code snippets only when both snippets are grounded in visible code
    - Framework-specific improvement suggestions
    - Execution-risk observations that are directly supported by visible code, or an explicit inconclusive note when evidence is missing

    **Tactical Focus:**
    - Review actual test code, not coverage strategy
    - Provide code-level improvements, not portfolio analysis
    - Focus on HOW tests are written, not WHAT to test
    - Give concrete examples and refactoring patterns
    - Before approving helper functions or fixtures, confirm each is referenced by at least one test — orphaned helpers cause lint errors that block the next workflow run
    - Prioritize maintainability and clarity
    - If evidence is incomplete, say unavailable or inconclusive instead of inferring broader health
    - If command compatibility is not visible, say it is unverified instead of assuming the scoped or repository-default test command executes the scoped files
    - Prefer visible test files, config, and evidence-manifest coverage over broad README or product context
    - If execution-risk evidence is incomplete, do not turn that absence into positive pass findings
    - Do not write unsupported positive summaries such as "all mocks are restored", "no performance issues", or "no major anti-patterns" unless the exact supporting file sections are visible and cited
    - For unsupported execution-risk conclusions, prefer the wording "inconclusive from the visible evidence" rather than "safe for CI", "no execution risks", or similar blanket pass statements
    - Do not pad any section with praise-only observations, repeated "continue doing X" advice, or generic filler; if no concrete issue is confirmed for a category, say so briefly and move on
    - Keep the final summary prioritized: confirmed issues first, minor cleanup suggestions second, and omit generic compliments unless they directly justify a recommendation
    
    **Examples of Bad vs Good Grounding:**
    - Bad: "`jest.resetModules()` proves mocks are reset per test." Good: "`jest.resetModules()` resets module state, but mock-call cleanup is not visible here."
    - Bad: "Only the happy path is tested." when the visible test covers reroute, retry, race, or failure handling. Good: name the specific async/control-flow scenario the excerpt actually shows.
    - Bad: "Use `.toHaveTextContent`" when DOM Testing Library or jest-dom is not visible in the provided imports/config/package metadata. Good: keep matcher advice within the visible toolchain.
    - Bad: "No execution risks" or "safe for CI" without direct evidence. Good: "Execution risk is inconclusive from the visible evidence."

    **Examples of Good Feedback:**
    - "Test at line 45: Extract common setup into beforeEach() for DRY"
    - "Use expect(result).toHaveLength(3) instead of expect(result.length).toBe(3)"
    - "Test name 'test 1' is unclear - rename to 'should return empty array when no items match'"
    - "Mock at line 67 is overly complex - use jest.fn() with mockReturnValue instead"
    - "'makeFileOps' at line 53 is defined but never called by any test case — remove it to eliminate the no-unused-vars lint error that will block the next workflow run"
    
    Please analyze the existing tests and provide a detailed review limited to the
    visible evidence, with specific, actionable recommendations for improving test
    quality and any concrete coverage gaps shown in the provided files.

# Step 8: Test Execution Analysis Prompt Template
step8_test_exec_prompt:
  # Split role into prefix + guidelines for token efficiency
  role_ref: step7_test_exec  # resolved from config/prompt_roles.yaml
  
  behavioral_guidelines: *behavioral_structured
  
  task_template: |
    Analyze the results of `{test_command}` for the {project_name} project, diagnose the concrete issues surfaced by this run, and provide actionable recommendations limited to the relevant test or validation workflow and any directly related GitHub Actions workflows.

    **Context:**
    - Project: {project_name}
    - Project Summary: {project_summary}
    - Primary Language: {primary_language}
    - Project Kind: {project_kind}
    - Test Framework: {test_framework} via `{test_command}`
    - Test Scope: Limit analysis to the work implied by `{test_command}`, the detected test types (`{test_types}`), the detected test config files (`{test_config_paths}`), and the execution evidence below. If this run is a validation-script invocation rather than a conventional unit/integration/e2e suite, treat it as validation-script analysis rather than assuming broader test-suite coverage.
    - Test Config Files: {test_config_paths}
    - Exit Code: {test_exit_code}
    - Results: {results_summary}
    - Coverage Threshold: {coverage_threshold}
    - Coverage Gaps: {coverage_gaps}
    - CI/CD Config: {ci_config_paths}
    - Scope: {scope_label}
    - Test Types: {test_types}
    
    **Test Execution Results:**
    {execution_summary}
    
    **Output:** (raw test runner console output, truncated to 2000 chars)
    {test_output}
    
    **Failed Tests:**
    {failed_test_list}
    
    **Tasks:**
    
        1. **Test Failure Root Cause Analysis:**
          - Identify why this run failed or produced incomplete results (assertion errors, runtime errors, timeouts, discovery/configuration problems, missing tests, crashed runners, or invalid validation-script targets)
          - Determine whether the issue is most likely in project code, test code, test configuration, the invoked validation script, or the execution environment
          - Categorize the issue precisely (breaking change, environment issue, flaky behavior, no-tests-found, config mismatch, validation-script misuse, or similar)
          - If the supplied output or listed config filenames are insufficient to isolate a cause, mark the result as unavailable or inconclusive instead of guessing a specific misconfiguration
          - If the runner produced no console output, treat configuration or discovery failure as unconfirmed unless the visible evidence explicitly includes a "no tests found" message or equivalent diagnostic
          - When `Test Types` is `validation-script`, keep diagnostics scoped to the configured command itself rather than assuming a conventional test runner or test-discovery phase
          - Do not prescribe `testMatch`, `testRegex`, missing-test-file, or file-naming fixes as confirmed remediation unless the visible output or provided config contents directly point to that problem
          - When config filenames are listed without their contents, do not cite unseen keys such as `testMatch`, `testRegex`, or `roots`, and do not cite unseen directories or patterns such as `test/`, `src/**/__tests__`, or file-naming conventions as evidence
          - In that insufficient-evidence case, keep follow-up actions limited to neutral diagnostics (for example rerunning locally, capturing stderr, or listing discovered tests) and label them as diagnostic next steps rather than fixes
          - For silent `validation-script` runs, do not recommend listing discovered tests, renaming test entry points, or addressing missing tests unless the visible evidence explicitly shows an actual test runner and test-discovery failure
          - Do not describe an inconclusive or silent run as a confirmed broken, non-functional, or misconfigured test setup unless the visible evidence proves that conclusion
          - Keep severity proportional to the confirmed evidence; reserve `Critical` for explicitly confirmed blocking failures, not merely for missing or inconclusive output
          - Provide specific fix recommendations grounded in the listed command, config files, and raw output
          - Priority level (Critical/High/Medium/Low) for each confirmed issue
    
      2. **Coverage Gap Interpretation:**
        - Analyze coverage metrics only when real coverage data or explicit coverage gaps are present in the provided context
        - Identify which listed modules or files have low coverage, if any are named
        - Determine whether coverage meaningfully meets the stated threshold
        - If no tests ran or no coverage artifact is available, state that limitation explicitly instead of inferring missing coverage details
        - Treat placeholder values such as `unavailable`, `none reported`, or a missing coverage artifact as inconclusive input, not proof that coverage passed
        - Recommend additional coverage only for files, directories, or test types that are actually supported by the provided context
    
     3. **Performance Bottleneck Detection:**
       - Identify slow-running tests or validation steps only when timing data or output signals support that conclusion
       - Detect expensive setup/teardown, repeated subprocess work, or serialization bottlenecks only when visible in the provided command/output/config context
       - Find tests or validation steps that could realistically be parallelized, if supported by the detected framework or scripts
       - Recommend execution optimizations that fit the listed test command and config files
       - Suggest mocking, fixture, or command-splitting strategies only when they match the detected test types
    
     4. **Flaky Test Analysis** (if multiple runs available):
       - Review test output for timing-related errors (timeouts, race conditions)
       - Identify tests that interact with external systems (filesystem, network, subprocesses)
       - Flag tests with random data generation without seeding
       - Note: True flaky test detection requires multiple runs; provide best-effort analysis from single execution
       - Recommend fixes for identified potential flaky patterns, but do not label a failure as flaky without supporting evidence
    
        5. **CI/CD Optimization Recommendations:**
          - Assess code-level test/validation quality separately from CI/CD pipeline configuration
          - When CI config files are listed above, reference those specific workflow filenames in recommendations and keep pipeline guidance tied to them
          - When no CI config files are listed above, explicitly state that limitation and restrict CI/CD guidance to general best practices rather than project-specific workflow edits
          - When no CI config files are listed above, use neutral forward-looking wording such as "consider adding a basic CI workflow" rather than repository-history claims such as "restore CI" unless that history is explicitly shown
          - When a workflow filename is listed but its YAML contents are not provided, keep project-specific workflow advice conditional instead of claiming a step is present or missing
          - Phrase workflow-specific recommendations conditionally (for example, "if `ci.yml` does not already...") unless the workflow YAML contents are visible in the prompt
          - Suggest test splitting, caching, coverage gates, or parallelization only when they fit the detected command, test types, and available workflow context
         - Propose pre-commit or local developer workflow improvements only when they follow naturally from the identified issue
  
  approach: |
    Analyze ONLY the test execution results explicitly provided above. Do not invent
    test files, module names, workflow files, or coverage metrics that are not in the
    provided context. Anchor the analysis to `{test_command}`, `{test_types}`,
    `{test_config_paths}`, `{ci_config_paths}`, the exit code, and the supplied output.
    Review the execution output, exit code, and pass/fail counts to diagnose issues.
    Provide specific, actionable recommendations grounded in the supplied data.
    Reference specific test directories, scripts, config files, or workflow files only when
    they are explicitly listed or directly inferable from the provided output and context.
    If the runner produced no output, or the prompt only names config/workflow files without
    showing their contents, do not assert a specific root cause or workflow gap unless the
    visible evidence directly supports that conclusion.
    When `Test Types` is `validation-script`, keep the analysis anchored to the configured
    command and its visible output instead of inferring unit-test discovery or missing-test
    problems.
    In that no-output case, prefer wording such as "root cause unavailable from captured evidence"
    or "runner exited silently" over guessing discovery/configuration defects, and avoid prescribing
    `testMatch`, `testRegex`, or test-path fixes as confirmed remediation unless the visible output
    or config contents point to them.
    For silent `validation-script` runs, limit next steps to rerunning the command, capturing
    stderr/stdout, and checking the referenced script or validator configuration unless the
    prompt includes explicit runner-specific diagnostics.
    When config filenames are listed without file contents, do not mention unseen config keys such
    as `testMatch`, `testRegex`, or `roots`, and do not mention unseen directories or filename
    patterns such as `test/`, `src/**/__tests__`, or naming conventions unless those details are
    explicitly shown in the prompt.
    In an inconclusive run, keep next steps diagnostic and evidence-preserving rather than phrasing
    them as confirmed repository fixes.
    Do not elevate severity beyond the confirmed evidence in an inconclusive run, and avoid phrases
    such as "validation is non-functional" unless the prompt explicitly proves the suite or pipeline
    is broken.
    When workflow filenames are listed without YAML contents, keep repository-specific CI guidance
    explicitly conditional and avoid stating that a step is missing, present, or misconfigured.
    Clarify whether the run reflects unit, integration, e2e, validation-script execution,
    or a mixed scope based on `Test Types` and the command shown above.
    For suite scope, coverage status, and CI/CD maturity, use explicit statuses such as
    `confirmed`, `inconclusive`, or `unavailable`; when the prompt lacks direct evidence,
    prefer `inconclusive`/`unavailable` over a success claim.
    Do not claim that coverage met a threshold, that all expected suites ran, or that the
    CI/CD pipeline is already robust unless the prompt directly shows those facts.
    If no CI/CD configuration files are listed above, explicitly note this limitation and
    restrict CI/CD recommendations to general best practices rather than project-specific
    pipeline configuration.
    Do not use repository-history claims such as "restore" unless that history is explicitly shown
    in the prompt.

    **Output:**
    - Root cause analysis for each failure with file:line:test references when the supplied evidence includes them; otherwise state that exact references are unavailable
    - Specific code fixes or test modifications needed when the evidence supports them; otherwise diagnostic next steps
    - Coverage improvement action plan
    - Performance optimization recommendations
    - Flaky test remediation steps
    - CI/CD integration best practices
    - Explicit `confirmed` / `inconclusive` / `unavailable` status language for suite scope,
      coverage conclusions, and CI/CD maturity whenever the evidence is partial
    - Priority-ordered action items
    - Estimated effort for each fix
    - Distinguish recommendation levels: code-level (test scripts/assertions), config-level (test config files), process-level (CI/CD pipeline)
    
    Please provide a comprehensive test results analysis with specific, actionable recommendations.

# Step 9: Dependency Management Analysis Prompt Template
step9_dependencies_prompt:
  # Split role into prefix + guidelines for token efficiency
  role_ref: step8_dependencies  # resolved from config/prompt_roles.yaml
  
  behavioral_guidelines: *behavioral_structured
  
  task_template: |
    Analyze any of the following manifest files present in this project (e.g. `package.json`,
    `package-lock.json` for npm; `requirements.txt` / `pyproject.toml` for pip; `go.mod` /
    `go.sum` for Go), assess security risks, evaluate version compatibility, and provide
    recommendations for dependency management and environment setup.

    > **Note:** Base your analysis solely on the data provided in the **Dependency Analysis
    > Results**, **Security Audit Summary**, and **Outdated Packages** sections below. The manifest
    > and lockfile contents were read from the project at analysis time.
    >
    > If the supplied results indicate that no supported manifest files were found, explicitly
    > state `No supported manifest files found` and avoid speculative recommendations. If any of
    > the referenced sections are missing, empty, or clearly insufficient, explicitly call out the
    > gap, explain how it limits the analysis, and restrict conclusions to the evidence available.
    >
    > Treat each requested check independently. If the prompt only includes summarized dependency
    > status without a manifest excerpt, runtime-version pin data, or dependency-tree/usage
    > evidence, the review is **limited**, not full. Do **not** claim `no version conflicts`,
    > `no unused dependencies`, `no duplicate packages`, `including transitive dependencies`, or
    > other success conclusions unless that exact evidence is supplied below.

    **Context:**
    - Project: {project_name}
    - Project Summary: {project_summary}
    - Primary Language: {primary_language}
    - Project Kind: {project_kind}
    - Package Manager: {package_manager} {package_manager_version}
    - Change Scope: {change_scope} (changed file categories in this run, not project architecture)
    - Modified Files: {modified_count}
    - Production Dependencies: {dep_count}
    - Development Dependencies: {dev_dep_count}
    - Total Packages: {total_deps}
    
    **Dependency Analysis Results:**
    {dependency_summary}
    
    **Automated Findings:**
    {dependency_report_content}
    
    **Production Dependencies:**
    {prod_deps}
    
    **Development Dependencies:**
    {dev_deps}
    
    **Security Audit Summary:**
    {audit_summary}
    
    **Outdated Packages:**
    {outdated_list}

    **Evidence Boundaries:**
    - Manifest Detail Level: {manifest_evidence_level}
    - Runtime Version Evidence: {runtime_version_evidence}
    - Lockfile Evidence: {lockfile_evidence}
    - Dependency Tree / Usage Evidence: {dependency_tree_evidence}

    **Manifest Excerpt (if available):**
    ```json
    {manifest_snippet}
    ```
    
    **Tasks:**
    
    1. **Security Vulnerability Assessment:**
       - Review security audit results
       - Identify critical/high severity vulnerabilities
       - Assess exploitability and impact
       - Provide immediate remediation steps
       - Recommend long-term security strategy
       - Consider transitive dependencies
    
    2. **Version Compatibility Analysis:**
       - Check for breaking changes in outdated packages
       - Identify version conflicts
       - Assess compatibility with language/runtime version
       - Review semver ranges (^, ~, exact versions) as declared in the manifest
       - Recommend version pinning strategy
    
    3. **Dependency Tree Optimization:**
       - Identify unused dependencies
       - Detect duplicate packages in tree
       - Find opportunities to reduce bundle size
       - Recommend consolidation strategies
       - Suggest peer dependency resolution
    
    4. **Environment Configuration Review:**
       - Validate runtime version requirements declared in the manifest (e.g. `engines` field in
         `package.json`, `python_requires` in `pyproject.toml`, `go` directive in `go.mod`)
       - Check package manager version requirements
       - Review `.nvmrc`, `.node-version`, or equivalent runtime-version pin files if present
       - Assess separation of runtime vs. development dependencies in the manifest
       - Recommend version management configuration (e.g. `engines`, `.nvmrc`, lockfile policy)
    
    5. **Update Strategy Recommendations:**
       - Prioritize updates (security > bug fixes > features)
       - Create phased update plan
       - Identify breaking changes to watch
       - Recommend testing strategy for updates
       - Suggest automation (Dependabot, Renovate)
  
  approach: |
    Analyze ONLY the dependencies and audit results explicitly listed above. Do not
    invent package names, vulnerability counts, or version data not present in the context.
    Review the provided dependency lists, audit summary, and outdated packages.
    Prioritize security vulnerabilities first, then version drift, then optimizations.
    Start by stating whether the provided evidence is sufficient for a full review, a limited
    review, or no review because no supported manifest files were found.
    Treat missing evidence as `Unavailable` or `Inconclusive`, not as a pass. For example:
    - No manifest excerpt => semver-range, runtime-version, and version-conflict analysis is limited
    - No dependency tree / usage scan => duplicate, unused, peer-resolution, and transitive claims stay inconclusive
    - No explicit runtime pin file data => do not recommend adding `engines` or `.nvmrc` if they are already shown
    - If the evidence boundary explicitly says `runtime pin files: none found`, treat that as confirmed absence from the supplied scan, not as an unresolved gap
    - A detected lockfile without a visible dependency tree is not enough to claim `no transitive dependencies`, `no peer dependency issues`, or `no bundle size issues`
    Do not turn absent evidence into reassuring summaries.

    **Output:**
    - Analysis status and any evidence gaps or missing sections
    - Security vulnerability assessment with severity levels
    - Immediate action items for critical vulnerabilities
    - Safe update path for outdated packages
    - Version compatibility matrix
    - Dependency optimization recommendations
    - Environment configuration best practices
    - Automated dependency management setup

# Step 10: Code Quality Assessment Prompt Template
# Step 10 Code Quality Prompt - Comprehensive Quality and Architecture Analysis
# Use for: Workflow Step 9, architectural reviews, technical debt assessment, system-wide analysis
# Focus: Comprehensive quality, maintainability, design patterns, architectural concerns
# NOT for: Quick file reviews, simple syntax checks
# Boundary: Use step10_code_quality_prompt for system-wide/architectural/comprehensive audits.
#            Use quality_prompt for quick/targeted/file-level reviews.
step10_code_quality_prompt:
  # Split role into prefix + guidelines for token efficiency
  role_ref: step9_code_quality  # resolved from config/prompt_roles.yaml
  
  behavioral_guidelines: *behavioral_structured
  
  task_template: |
    Perform a comprehensive code quality review of the source code, tests, and documentation listed in the **Context** section below. Restrict your analysis to the files in scope — exclude third-party dependencies, node_modules, and generated/build artefacts. Identify anti-patterns, assess TDD adherence and test coverage, evaluate maintainability, check linting/formatting compliance and JSDoc documentation quality, and provide actionable recommendations grouped by priority (**quick wins** = low effort, high impact; **long-term** = architectural or structural changes requiring significant effort).

    {partition_header}

    **Context:**
    - Project: {project_name}
    - Project Summary: {project_summary}
    - Primary Language: {primary_language}
    - Project Kind: {project_kind}
    - Technology Stack: {tech_stack_summary}
    - Change Scope: {change_scope} (changed file categories in this run, not project architecture)
    - Files in This Request: {files_in_scope}
    - Modified Files in Run: {modified_count}
    - Code Files: {total_files} total
    - Language Breakdown: {language_breakdown}

    > If no specific file paths or file contents are provided below, do **not** claim a
    > repository-wide review succeeded. Limit conclusions to the visible automated findings
    > and mark any code-, test-, docs-, or process-level checks that require missing evidence
    > as unavailable or inconclusive instead of claiming success.
    > {partition_scope_note}
    
    **Code Quality Analysis Results:**
    {quality_summary}
    
    > **Note:** The **Automated Findings** section below is sourced from the most recent
    > analysis run for the files in scope. Treat reported file counts, lint commands,
    > and lint results as snapshots from that run, and explicitly call out any missing
    > or truncated data before drawing conclusions.
    
    **Automated Findings:**
    {quality_report_content}
    
    **Large Files Requiring Review:**
    {large_files_list}
    
    **Code Samples for Review:**
    {sample_code}

    **Supplementary Tooling, Convention, and Test Evidence:**
    {supporting_quality_scope_note}
    {supporting_quality_context}

    **Mandatory Cohesion / Coupling Guide Status:**
    {cohesion_guide_status}

    **File Contents for Review:**
    {file_content_map}

    > Entries labeled `(part X/Y)` are sequential slices of an oversized source file.
    > Review only the visible slice(s) in this request. Do not assume the unseen remainder
    > is clean, and do not treat the absence of other slices in this single prompt as proof
    > that the file was fully reviewed elsewhere unless the prompt explicitly says so.
    > If a visible file is clearly minified, bundled, transpiled, or content-hashed build
    > output (for example a compressed one-line JS bundle under `assets/` or `public/v*/assets/`),
    > treat it as generated/build artefact that should have been excluded from this review.
    > Do not infer source-level formatting, JSDoc, naming, or test-coverage gaps from that
    > artifact alone; keep those checks unavailable or inconclusive and limit any recommendation
    > to excluding the generated artifact from scope.
    > If every visible file in this request is generated/build output, do not assign an A-F quality
    > grade or a maintainability score to those artifacts as if they were authored source; report
    > the assessment as not applicable or inconclusive for source-quality scoring instead.
    
    **Tasks:**
    
    1. **Code Standards Compliance Assessment:**
       - Evaluate language coding standards and best practices
       - Check for consistent code formatting and style
       - Review naming conventions (variables, functions, classes)
       - Assess consistent indentation and formatting
       - Validate documentation/comment quality
       - Check error handling patterns
       - Verify linting compliance (`npm run lint` / ESLint) only when the provided context shows both the lint result and enough command/config scope to determine that the visible file or path is covered; otherwise mark file-level lint conclusions inconclusive
       - Do not collapse multi-language or multi-file automated lint summaries into blanket statements such as "all files in scope pass linting"; only restate the checks that can be traced to each visible file or path
       - Verify formatting compliance (`npm run format` / Prettier) only when a formatter command, config, or formatter output is visible in the provided context; otherwise mark formatting conclusions inconclusive
       - When supplementary evidence shows formatter config or formatter scripts are present, do not recommend adding/restoring formatter tooling or config; limit the conclusion to whether compliance is still inconclusive
        - Check JSDoc completeness only for public functions, classes, and exported symbols whose source is visible in the provided file contents; if exports are not shown, mark JSDoc coverage as unavailable or inconclusive
        - Identify and apply project-specific coding conventions from `CONTRIBUTING.md` or `.github/copilot-instructions.md`, when those files are present in the provided context; these take precedence over generic language defaults
        - Do not claim compliance with project conventions unless the relevant convention source is visible in the prompt context; otherwise mark project-convention compliance inconclusive
        - Also consult other project guides found under `.github/` when present in the context (e.g., `CODE_REVIEW_GUIDE.md`, `TDD_GUIDE.md`, `UNIT_TEST_GUIDE.md`, `HIGH_COHESION_GUIDE.md`, `LOW_COUPLING_GUIDE.md`, `JAVASCRIPT_BEST_PRACTICES.md`)
        - For projects that contain code files, treat `.github/HIGH_COHESION_GUIDE.md` and `.github/LOW_COUPLING_GUIDE.md` as mandatory guidance files; if either is reported missing in the visible context, include that as a concrete project issue rather than an optional suggestion
       - When the guide-status block marks either mandatory guide as PRESENT, do not recommend adding or restoring that guide
    
    2. **Best Practices Validation:**
       - Verify separation of concerns
       - Check for proper error handling
       - Assess design patterns usage
       - Review async patterns (if applicable)
       - Validate proper variable declarations
       - Check for magic numbers/strings
    
     3. **Maintainability & Readability Analysis:**
        - Assess function complexity (cyclomatic complexity)
        - Evaluate function length (should be reasonable)
        - Check variable naming clarity
        - Review code organization and structure
        - Assess whether each module/function has a single, cohesive responsibility
        - Assess comment quality and documentation
        - Identify overly complex logic
    
    4. **Anti-Pattern Detection:**
        - Identify code smells (duplicated code, long functions)
        - Detect language-specific anti-patterns
        - Find improper global usage; treat exported environment variables, `process.env` mutation, `globalThis`/`window` writes, and other shared process/module state as global interaction rather than claiming "no globals"
        - Spot tight coupling between modules
        - Identify low-cohesion modules that mix unrelated responsibilities
        - Identify monolithic functions
        - Detect violation of DRY principle
    
     5. **Refactoring Recommendations:**
        - Suggest modularization opportunities
        - Recommend function extraction for clarity
        - Recommend responsibility splits that increase cohesion and reduce coupling
        - Propose design pattern applications
        - Suggest performance optimizations
        - Recommend code reuse strategies
       - Identify technical debt priorities
    
    6. **Test Quality & TDD Adherence:**
       - Assess test coverage breadth (are key behaviours, edge cases, and error paths tested?) only when the relevant implementation files, test files, or explicit coverage artefacts are visible; otherwise mark coverage conclusions inconclusive
       - Evaluate TDD discipline: test naming clarity, test-first indicators, tests as documentation
       - Check test isolation (no shared mutable state, deterministic outcomes)
       - Identify brittle or flaky tests (time-dependent, order-dependent, over-mocked)
       - Review mock/stub hygiene (mocks that verify behaviour vs. mocks that just silence errors)
       - Assess test maintainability (DRY helpers, meaningful assertions, clear failure messages)
       - Apply project `TDD_GUIDE.md` or `UNIT_TEST_GUIDE.md` standards when present in the provided context

     7. **Process & Commit Quality:**
        - Review adherence to [Conventional Commits](https://www.conventionalcommits.org/) only when commit messages or history are visible in the provided context; otherwise mark commit-quality conclusions inconclusive
        - Check that commit messages reference related issues or PRs where appropriate only when those artefacts are visible
        - Note any commits that bundle unrelated concerns (should be atomic) only when the commit history or diffs are visible
        - Assess whether PR descriptions (if visible) describe the change and reference related issues; if PR metadata is absent, state that this check could not be completed
        - Flag any secrets, debug artifacts, or generated files that should not be committed
  
  approach: |
    Analyse only the **{project_name}** files shown above. Do not reference other repositories, third-party dependencies, `node_modules`, or any project not present in the context.

    Review code quality, anti-patterns, technical debt, and maintainability only for files whose paths or contents are explicitly shown above. Treat `Code Quality Analysis Results` and `Automated Findings` as supporting evidence, not proof that qualitative checks passed.

    If the provided file contents are missing, truncated, or too partial to support a requested conclusion, explicitly state that the result is unavailable or inconclusive instead of claiming success.

    Do not treat a reported lint command or lint result as evidence for a specific file unless the visible command, config, or path scope shows that the file is actually covered.
    Do not restate repository-wide or multi-language automated summaries as "all files in scope pass" unless each claimed check is traceable to the visible file(s) in this request.
    If automated findings are aggregate by language or run-wide, describe them as aggregate snapshots rather than file-level pass/fail evidence.
    Do not convert aggregate tooling, CI, markdown, formatter, or repository-wide process snapshots into file-scoped findings or top priorities unless the affected file/path is explicitly visible in this request.
    Do not infer formatter compliance unless formatter tooling/configuration/output is visible in the prompt context.
    If supplementary evidence shows formatter config or formatter scripts are present, do not recommend adding or restoring formatter tooling; only discuss whether file-level compliance remains inconclusive.
    Do not claim compliance with project-specific conventions unless the relevant convention documents are included in the prompt context.
    Do not assert JSDoc completeness unless the relevant exported/public symbols are visible in the provided source.
    Do not assert that test coverage is sufficient or that no coverage gaps exist unless the relevant code/tests or explicit coverage artefacts are visible.
    Do not assess commit-message quality, PR quality, or atomicity unless commit history, diffs, or PR metadata are provided.
    For projects with code files, treat `.github/HIGH_COHESION_GUIDE.md` and `.github/LOW_COUPLING_GUIDE.md` as mandatory. When either is missing in the provided guide-status block, report that absence explicitly and include remediation.
    When the guide-status block marks a mandatory guide as PRESENT, do not recommend adding or restoring it.
    When a file visibly exports or mutates process environment, global state, or other shared module-level state, do not say "no globals"; describe whether that global interaction is intentional and acceptable.
    If a visible file is obviously bundled/minified/generated build output, treat it as an evidence-limit case rather than primary source. Do not recommend missing JSDoc, test coverage, formatter tooling, or naming cleanup based solely on generated output.
    If every visible file is generated/build output, the assessment is not applicable for source-quality scoring. Recommendations limited to excluding generated artifacts from scope or requesting the authored source; do not recommend `.gitignore`, README, CI, or regeneration-pipeline changes when the visible context already shows those controls exist.

    Separate confirmed findings from inconclusive checks so unsupported areas are not presented as passing.

    **Output:**
    - **Assessment**: Quality grade (A-F), maintainability score, standards compliance
    - **Findings**: Anti-patterns, violations, tech debt, and explicitly inconclusive checks with file:line references when available
    - **Recommendations**: Top 5 refactoring priorities with effort estimates (quick wins vs long-term), but only when each item is tied to a visible file/path in scope; otherwise state that no file-scoped refactoring priorities are confirmed from the visible evidence
    
    **Tooling Note:** Where project-specific linting or static-analysis tools are visible in the provided context (including tech stack or config files), reference those tools when citing violations. Cite specific rule names only when the tool configuration is clearly visible in the context; otherwise describe the violation generically.

    Please provide a comprehensive code quality assessment with specific, actionable recommendations.

cohesion_review_prompt:
  role_ref: software_architect
  behavioral_guidelines: *behavioral_structured

  task_template: |
    Perform a focused cohesion and coupling review for **{project_name}** using only the code excerpts and guide-status evidence below.

    **Context:**
    - Project: {project_name}
    - Primary Language: {primary_language}

    **Mandatory Guide Status:**
    {cohesion_guide_status}

    **File Contents for Review:**
    {file_content_map}

    **Tasks:**
    1. Determine whether each visible file or file fragment is highly cohesive or mixes unrelated responsibilities
    2. Identify coupling hotspots between modules, shared state, orchestration, and helper layers
    3. Flag missing `.github/HIGH_COHESION_GUIDE.md` or `.github/LOW_COUPLING_GUIDE.md` as project issues whenever the guide-status block marks them missing
    4. Recommend the smallest refactors that increase cohesion and reduce coupling without over-fragmenting the code

  approach: |
    Work only from the visible code excerpts and the mandatory guide-status block.
    Do not infer unseen modules or claim file-level cleanliness outside the visible excerpts.
    Prefer concrete statements about responsibilities, boundaries, and dependency direction over generic style feedback.
    When a module mixes unrelated concerns, explain the split in terms of responsibilities rather than line counts alone.

  output_format: |
    **Cohesion & Coupling Review**

    **Guide Compliance**:
    - [List missing mandatory guide files, or state that both mandatory guides are present]

    **Findings**:
    | Area | Issue | Impact | Recommended Change |
    |------|-------|--------|--------------------|
    [One row per confirmed finding; use ✅ if none found in the visible excerpts]

    **Refactoring Direction**:
    [Concrete recommendations to improve cohesion and reduce coupling]

# Error Resilience Prompt Template
# Supplementary per-partition pass run by Step 10 (code quality) for all project kinds
# except static_website and configuration_library.
# Focuses on production failure modes that the main quality sweep may miss:
# uncaught exceptions, unhandled promise rejections, empty catch blocks, missing
# await, silent failure swallowing, and error-masking patterns.
error_resilience_prompt:
  role_ref: software_quality_engineer  # resolved from config/prompt_roles.yaml
  behavioral_guidelines: *behavioral_actionable

  task_template: |
    Perform a focused **Error Resilience Review** of the provided source files.
    Your goal is to surface production-threatening failure modes that are often
    invisible in standard code-quality sweeps.

    **Context:**
    - Project: {project_name}
    - Primary Language: {primary_language}

    **Scope — look exclusively for:**

    1. **Uncaught Exceptions & Unhandled Rejections**
       - `async` functions called without `await` and without `.catch()`
       - `Promise.all` / `Promise.allSettled` calls with no rejection handler
       - Event emitters (`EventEmitter`, DOM `addEventListener`) without error events
       - Top-level `async` IIFE without a `.catch()` or `try/catch`

    2. **Silent Failure Swallowing**
       - Empty `catch` blocks: `catch (e) \{\}`  or `catch \{ /* ignored */ \}`
       - Catch blocks that only log without re-throwing or surfacing the error
       - Optional chaining (`?.`) used where a missing value should be a hard error
       - Fallback defaults (`?? defaultVal`) that hide data-contract violations

    3. **Missing `await` on Async Calls**
       - Calls to `async` functions or Promise-returning APIs whose result is
         discarded (no `await`, no `.then()`, no variable assignment)
       - `fs.writeFile`, database writes, HTTP requests left un-awaited

    4. **Error Masking in Control Flow**
       - `try/catch` that catches broadly and returns `null`/`undefined`/`false`
         without logging the original error
       - Error objects converted to strings or generic messages, losing stack traces
       - Retry loops that swallow errors on the last attempt

    5. **Resource Leak on Error**
       - File handles, DB connections, or streams opened inside `try` blocks with
         no `finally` to guarantee closure

    **Files to Review:**
    {file_content_map}

    If any provided file is clearly minified, bundled, transpiled, or generated build output,
    do not infer source-level resilience defects from compressed structure, renamed variables,
    or missing surrounding context alone. Only report directly visible failure modes; otherwise
    mark the observation inconclusive and note that the generated/build artifact should have
    been excluded from scope.
    If all provided files are generated/build artifacts and no directly visible failure mode is
    present, emit no finding entries and return only the summary line. Do not invent pseudo-findings,
    custom categories, or severity-less placeholders for generated artifacts.

    **Output Format:**
    For each finding, output:
    - **File**: `filename.ext:line` (or best estimate if exact line is unclear)
    - **Category**: one of Uncaught Rejection / Silent Failure / Missing Await /
      Error Masking / Resource Leak
    - **Severity**: Critical (can crash or corrupt) / High (likely silent data loss)
      / Medium (degrades observability)
    - **Finding**: one-sentence description of the problem
    - **Fix**: concrete code-level recommendation

    If no issues are found in a category, skip that category entirely.
    End with a one-line summary: total findings by severity.
    Count the listed findings by severity and ensure the summary matches those counts exactly.
    Do not report a severity in the summary if no finding above uses that severity.

# Step 12: Git Commit Message Generation Prompt Template
step12_git_commit_prompt:
  output_format: |
    **OUTPUT REQUIREMENT**:
    Return ONLY the raw commit message text, ready to paste directly into git.
    No markdown code blocks (no ```), no explanatory preamble, no wrapper text.
  
  # Split role into prefix + guidelines for token efficiency
  role_ref: step11_git_commit  # resolved from config/prompt_roles.yaml
  
  behavioral_guidelines: *behavioral_generative
  
  commit_types: |
    - feat: New feature or capability
    - fix: Bug fix
    - docs: Documentation only changes
    - style: Formatting, whitespace, no code change
    - refactor: Code restructuring without behavior change
    - test: Adding or updating tests
    - chore: Maintenance tasks, tooling, dependencies
    - perf: Performance improvement
    - ci: CI/CD pipeline changes
  
  task_template: |
    Generate a professional, concise conventional commit message that clearly
    communicates the changes, follows best practices, and provides useful
    context for code reviewers and future maintainers. Avoid unnecessary
    repetition — each line should add distinct value.

    Check for project-specific commit conventions in:
    1. `.github/CONTRIBUTING.md`
    2. `CONTRIBUTING.md` (project root)

    Match file paths using the host filesystem's normal case rules: treat the
    lookup as case-insensitive on case-insensitive filesystems, and
    case-sensitive otherwise.

    If both files exist, inspect both for commit-message rules. If only one
    file defines commit conventions, follow that file regardless of directory.
    If both define commit conventions and they conflict,
    `.github/CONTRIBUTING.md` takes precedence. If a file exists but only
    partially defines conventions (e.g., covers PR format but not commit
    messages), apply the rules it does define and fill any remaining gaps with
    the [Conventional Commits](https://www.conventionalcommits.org)
    specification. If neither file is present or neither addresses commit
    format, use the Conventional Commits specification as the baseline standard
    without hesitation — never stall or fail because a conventions file is
    absent.
    
    **Conventional Commit Types:**
    {commit_types}
    
    **Context:**
    - Project: {project_name}
    - Project Summary: {project_summary}
    - Workflow: Tests & Documentation Automation v{script_version} (ai_workflow automated pipeline run for this project's current version; project version typically sourced from `package.json`, with `.workflow-config.yaml` available as supplemental project metadata when present)
    - Change Scope: {change_scope} (changed file paths listed in "Changed Files" section below)
    
    **Git Repository Analysis:**
    {git_context}
    
    **Changed Files:**
    {changed_files}

    Treat "Changed Files" as the authoritative list of project files in scope
    for this commit.
    
    **Staged Commit Statistics (includes workflow artifacts and individual file names):**
    {diff_summary}
    
    **Detailed Context:**
    {git_analysis_content}
    
    **Diff Sample (first 100 lines):**
    {diff_sample}

    The diff sample is partial and may omit files or surrounding context. Do
    not claim validation, synchronization, alignment, or completeness unless
    the provided context explicitly shows it. If counts disagree or the
    evidence is partial, use cautious wording and avoid unsupported exact
    claims.

    Do not treat filenames, file categories, commit heuristics, or
    auto-extracted issue summaries as proof of a specific change within a file.
    Only mention a file-level action, rationale, improvement, or impact when
    the provided diff content or explicit contextual text shows it.

    If the visible evidence is too limited to support a confident body
    paragraph, bullet list, or breaking-change conclusion, prefer a shorter
    commit message and leave the uncertain detail unstated. Do not add "No
    breaking changes detected" or similar certainty language unless the
    provided context explicitly supports that conclusion.
    
    **Tasks:**
    
    1. **Conventional Commit Message Crafting:**
       - Select appropriate type from the list above
       - Define clear scope (e.g., deployment, testing, documentation)
       - Write concise subject line (<50 chars if possible, max 72)
       - Follow format: type(scope): subject
       - Use imperative mood ("add" not "added" or "adds")
       - Don't end subject with period
    
    2. **Semantic Context Integration:**
       - Analyze what changed and why
       - Identify the business value or technical benefit
       - Connect changes to workflow or project goals
       - Reference workflow automation context
       - Note automation tool version
    
    3. **Change Impact Description:**
       - Describe what was changed (files, features, functionality)
       - Explain why changes were made
       - Note any architectural or structural improvements
       - Highlight test coverage or documentation updates
       - Mention dependency or quality improvements
    
    4. **Breaking Change Detection:**
       - Identify any breaking changes (API, behavior, interface)
       - Flag deprecations or removals
       - Note migration steps if applicable
       - Assess backward compatibility
    
    5. **Commit Body & Footer Generation:**
       - Provide detailed multi-line body if needed
       - List key changes as bullet points
       - Include relevant issue/PR references
       - Add footer metadata (automation info, breaking changes)
       - Follow 72-character line wrap
  
  approach: |
    Review ONLY the staged changes listed above. Write commit messages strictly based on the provided diff content — do not reference files, features, or changes not shown.

    **Commit Message Format:**
    
    type(scope): subject line here
    
    Optional body paragraph explaining what and why, not how.
    Wrap at 72 characters per line.

    It is acceptable to return only the subject line when a fuller body would
    require speculation beyond the provided evidence.
    
    - List key changes as bullet points
    - Each bullet should be clear and actionable
    - Focus on user/developer impact
    
    BREAKING CHANGE: describe any breaking changes
    Refs: #issue-number (if applicable)
    [workflow-automation v{script_version}]
    
    **Remember**: Output only the commit message text with NO markdown
    code blocks.

# Markdown Linting Analysis Prompt Template
markdown_lint_prompt:
  # Split role into prefix + guidelines for token efficiency
  role_ref: markdown_lint  # resolved from config/prompt_roles.yaml
  
  behavioral_guidelines: *behavioral_actionable
  
  task_template: |
    Review the markdown linting results and provide actionable
    recommendations for improving documentation quality. Use the
    following style-guide hierarchy (highest priority first):

    1. **`.github/copilot-instructions.md`** — primary project-level
        authority; check whether this file exists before applying its
        rules.
    2. **Contribution guidance files that actually exist** — check, in
       order, `.github/CONTRIBUTING.md`, `docs/CONTRIBUTING.md`, and
       `CONTRIBUTING.md`. Apply only the markdown or documentation rules
       that are explicitly present in the visible file content.
    3. **Generic markdown defaults** — apply only when the visible evidence
       confirms that project-specific files are absent or silent on a topic.
       Examples: CommonMark compliance, ATX-style headings (`#` prefixes),
       blank lines before/after fenced code blocks, and descriptive link text.

    **Before beginning your analysis**, confirm which of the above files
    are present in the codebase. Start your response with a
    **Style Guide Sources** section that lists each checked path as
    present, missing, or `Unavailable from visible evidence`, and
    briefly names the visible markdown rules that apply.

    **Visible evidence** means file paths or file-content blocks that
    appear verbatim in this prompt. A bare filename in a listing is
    evidence of existence only, never of file content, redirect
    behavior, or applicable rules.

    Only mark a path **Present** or **Missing** when the provided
    evidence explicitly shows that status. Otherwise mark it
    `Unavailable from visible evidence`.

    If a file exists but does not define markdown guidance relevant to
    this task, say so and fall back to the next source in the
    hierarchy. Do not assume a missing file exists, and do not assume
    one `CONTRIBUTING` location redirects to another unless the visible
    file content explicitly says so.

    If you cannot confirm the hierarchy from the visible evidence, mark
    the style-guide check and any dependent conclusions
    `Inconclusive from provided evidence` rather than proceeding as if
    the hierarchy had been verified. Items marked
    `Unavailable from visible evidence` must not be restated as missing,
    gaps, or recommended additions elsewhere in the output.

    If only one project-specific file is visibly present, apply its
    rules for the topics it covers and fall back to generic markdown
    defaults only for topics that the visible content leaves silent.

    If multiple project-specific files are visibly present and they
    conflict, `.github/copilot-instructions.md` takes precedence over
    contribution guides. In all cases, project-specific conventions
    override generic markdown defaults only when their content is
    visible and relevant. Do not prescribe a repo-specific indentation
    width, editor setting, or remediation step unless the visible
    evidence shows that rule or configuration.
    
    # Markdown Linting Results
    {lint_report}
    
    # Git Context
    Branch: {current_branch}
    Modified markdown files: {modified_md_count}
    
    # Focus Areas (Enabled Rules Only)
    
    The following rules are treated as **DISABLED** for this analysis and
    should be **IGNORED** in your response:
    - MD001 (header level increments) - AI formatting pattern
    - MD002 (first header level) - document structure flexibility
    - MD012 (multiple blank lines) - visual separation preference
    - MD013 (line length) - long URLs and code blocks
    - MD022 (blank lines around headers) - compact formatting
    - MD029 (ordered list prefixes) - numbering flexibility
    - MD031 (blank lines around code blocks) - compact formatting
    - MD032 (blank lines around lists) - compact formatting
    
    > **Note:** Disabled rules typically account for the majority of the
    > total issue count (e.g., MD029 and MD013 are commonly the top
    > violations by frequency). These high counts are expected and
    > intentional — do not flag them as problems.
    
    Focus ONLY on these **ENABLED** rules that indicate real quality
    issues:
    
    1. **MD007 - List Indentation**: Nested lists must follow the
       visible project rule; if no indentation rule is shown, do not
       prescribe a repo-specific indent width
    2. **MD009 - Trailing Spaces**: Whitespace at end of lines (easily
       fixable)
    3. **MD026 - Header Punctuation**: Headers should not end with . ! ? ,
    4. **MD047 - Final Newline**: Files must end with single newline
       character
    
    # Analysis Request
    
    Please provide:
    
    1. **Severity Assessment**: 
       - Rate overall quality (Excellent/Good/Needs Improvement/Poor)
         only when the visible evidence supports an enabled-rule quality
         judgment
       - If enabled-rule evidence is limited to aggregate counts,
         top-file totals, missing mappings, or other partial evidence,
         use `Inconclusive from provided evidence` instead of forcing one
         of the four quality labels
       - Do not label the repository Excellent, Good, Needs Improvement,
         or Poor solely because no enabled-rule violations are visible in
         partial evidence
       - Base assessment ONLY on enabled rules (ignore disabled rules)
       - Prioritize recommendations by **impact on documentation quality**
         (rendering correctness, accessibility, readability) rather than
         by raw violation frequency
    
    2. **Critical Issues**:
       - List specific files and line numbers with enabled rule
         violations only when the provided evidence explicitly includes
         them
       - If the visible lint output includes only aggregate counts,
         top-file totals, or other partial evidence, say
         `Unavailable from visible lint output` or
         `Inconclusive from provided evidence` instead of inferring file-
         or line-specific violations
       - Do not assign a rule to a file unless the visible evidence links
         that rule to that file
       - Explain impact on rendering or accessibility
       - DO NOT mention disabled rules (MD001, MD002, MD012, MD013, MD022,
         MD029, MD031, MD032)
    
    3. **Quick Fixes**:
       - Provide specific sed/awk commands for bulk fixes
       - Commands must work from the repository root without requiring
         shell-option changes such as `globstar`; prefer `find ... -exec
         ... {} +` or `rg --glob '*.md'`
       - If the visible evidence does not tie a specific enabled rule to
         concrete findings, keep commands generic examples rather than
         presenting one rule family as the confirmed priority
       - Example for trailing spaces:
          `find . -name "*.md" -exec sed -i 's/[[:space:]]*$//' {{}} +`
       - Example for final newline:
          `find . -name "*.md" -exec sh -c 'tail -c1 {{}} | read -r _ || 
          echo >> {{}}' \;`
     
    4. **Editor Configuration**:
       - Suggest `.editorconfig` settings only as recommendations unless
         the file content is explicitly shown in the provided evidence
       - Recommend VS Code / editor settings
       - If `.editorconfig` or editor settings are not visibly present,
         do not describe them as missing gaps or as the next focus area;
         keep them clearly optional and conditional
     
    5. **Prevention Strategy**:
       - How to avoid these issues in AI-generated markdown
       - Pre-commit hook recommendations
       - Workflow automation improvements
       - Base repo-specific recommendations only on files or
         configuration visibly present in the provided evidence
       - When repo-wide tooling status is not visible, label the
         prevention/tooling check `Unavailable from visible evidence`
         instead of filling the section with speculative repo-specific
         next steps
       - If existing automation already covers a rule, acknowledge that
         coverage before suggesting incremental improvements
       - Do not claim PR-wide, CI-wide, or branch-trigger coverage unless
         a visible workflow or CI configuration explicitly shows that
         trigger; otherwise describe only the confirmed local coverage
         and mark trigger scope as unavailable or inconclusive
       - Do not describe `.editorconfig`, pre-commit hooks, or CI linting
        as absent, missing, or the primary focus unless that status is
        visible in the provided evidence
  
  approach: |
    Analyze ONLY the markdown files and lint results explicitly listed above. Do not report violations for rules not in the enabled set.

    **Scope**: Analyze only enabled rules (MD007, MD009, MD026, MD047).
    Disabled rules (MD001, MD002, MD012, MD013, MD022, MD029, MD031, MD032)
    are intentionally relaxed for AI-generated content and should not be
    mentioned in your analysis.

    Treat aggregate totals, top-file lists, and anti-pattern summaries as
    partial evidence. If the visible data does not include exact enabled-
    rule file/line mappings, do not fabricate them; prefer an explicit
    unavailable or inconclusive result.
    Absence of visible enabled-rule mappings is not evidence of quality:
    do not convert sparse evidence into a "Good" or equivalent overall
    rating.
    Keep conclusions proportional to the evidence: if the prompt shows
    only aggregate counts or sparse rule summaries, do not end with a
    "focus on" recommendation that elevates whitespace fixes,
    `.editorconfig`, pre-commit hooks, or CI automation as the main
    problem unless the visible evidence explicitly supports that focus.
    If repo-wide tooling evidence is unavailable, do not convert that gap
    into concrete next steps for `.editorconfig`, hooks, or CI. Mark the
    prevention/tooling claim `Unavailable from visible evidence` and stop
    there.
    
    **Output Format:**
    - Begin with `**Style Guide Sources**` and state which hierarchy
      files were checked, which were present, and which visible rules
      applied
    - Concise analysis focused on enabled rules only
    - Specific file paths and line numbers for violations only when
      visible evidence supports them
    - Actionable recommendations with commands/examples that stay
      proportional to the visible evidence
    - Keep automation and prevention advice conditional when supporting
      config or coverage is unavailable from visible evidence
    
    **Best Practices (only when the corresponding enabled-rule evidence is
    explicitly visible):**
    - MD009 / trailing spaces: Enable "trim trailing whitespace on save"
      in editor
    - MD047 / final newline: Enable "insert final newline" in editor
    - MD007 / list indentation: Follow the indentation rule shown in
      visible project config; otherwise keep recommendations generic
    - MD026 / header punctuation: Headers are labels, not sentences
    
    **Reference Documentation:**
    - Cite only repo files that are actually visible in the provided
      evidence
    - Do not claim `.mdlrc`, `.editorconfig`, CI requirements, or
      markdown-specific guide files exist unless the visible evidence
      confirms them
    - When visible evidence already shows existing pre-commit or CI
      coverage, acknowledge it instead of recommending it as missing


# Step 04: Configuration Specialist Prompt Template
# Purpose: Validate and analyze configuration files for schema correctness, security, and best practices
# Version: 1.0.8 (v6.8.45 - Tighten evidence rules for sparse configs and freshness claims)
configuration_specialist_prompt:
  # Split role into prefix + guidelines for token efficiency
  role_ref: configuration_specialist  # resolved from config/prompt_roles.yaml
  
  behavioral_guidelines: *behavioral_actionable
  
  task_template: |
    Validate and analyze the configuration file(s) listed in
    the **Configuration Files in Scope** sub-section directly below, such as package manifests
    (`package.json`, `requirements.txt`), env files (`.env`, `.env.production`),
    CI workflows, Docker/compose files, editor/tooling configs, and AI-workflow
    YAML when present. Analyze only the files explicitly listed in that sub-section —
    do not infer, search for, or include any other files. Treat that scope list as
    authoritative if it conflicts with any summary count elsewhere in this prompt.
    The **File Contents** section below will follow that authoritative scope list and
    may include only a subset of those files in this run. For each file shown in
    **File Contents**, check syntax/schema correctness, security hygiene, consistency
    with related configs only when those related configs are also visible in
    **File Contents**, and stack-specific best practices for the tech stack listed
    in **Project Context**, when provided.

    {partition_header}

    ### Configuration Files in Scope
    Each entry below is grouped by parent directory and formatted as
    `**Directory Label**: comma-separated filenames`. If a file was split into
    prompt-safe parts, the `(part X/Y)` suffix belongs to the filename, not to
    the directory label. In this list, `Root` means the project root directory.
    {config_files_list}

    > **Note:** The scope list above defines the exact set of files to analyze.
    > Treat each labeled line as a directory-scoped bucket of files, not as a
    > separate instruction block with hidden requirements.
    > {partition_scope_note}
    > - If a listed file is absent from **File Contents** below, report it as "content
    >   unavailable" — do not infer its contents or skip it silently. A file's absence
    >   may reflect prompt scoping, project-specific exclusions, or the file not being
    >   present in the active workspace; do not treat that absence alone as a configuration
    >   defect.
    > - If a **File Contents** entry includes an explicit truncation marker such as
    >   `[truncated ...]` or `...(truncated — remainder omitted)`, treat that file as
    >   partial evidence only. Report the unavailable remainder as inconclusive, limit
    >   claims to the visible excerpt, and do not claim full-file validation or
    >   "All configuration files validated successfully" unless every in-scope file is
    >   present in full.
    > - Deterministic syntax/schema validation has already run on the full in-scope
    >   configuration files before this prompt was generated. If a file entry is marked
    >   as a sequential slice or continuation, do not treat that slice as a standalone
    >   document for syntax/schema pass-or-fail claims.
     > - A **File Contents** entry may be a deliberate compact summary of a generated
     >   lockfile or other oversized machine-generated config. When clearly labeled as a
     >   summary, analyze only the summarized fields shown and do not assume the raw file
     >   was inspected verbatim line by line.
     > - Keep praise evidence-bound. If a file is sparse or only a slice is visible, do
     >   not generalize that evidence into broad claims such as "follows standard
     >   Node/TypeScript ignore patterns" unless the visible content actually shows that
     >   wider coverage.
     > - If a check reveals no visible problem, omit it instead of emitting a
     >   severity/recommendation pair that only says no action is needed.
     > - Ignore unrelated files even if they appear in another section of this prompt.
     >   Only the scope list above and the matching **File Contents** entries are in scope.
    > - Do not cite a previous partition, another partition, or an unseen excerpt as
    >   evidence for this request. If support would require another partition or prior
    >   request, mark that conclusion unavailable from the current prompt.
    > - If the scope list is empty or resolves to "none found", that is a valid outcome.
    >   State that no configuration files were in scope for this run and do not infer
    >   any additional files.

    ### Project Context
    - Project Type: {project_kind}
    - Tech Stack: {tech_stack}
    - Files in This Partition: {partition_config_count}
    - Total Config Files in Run: {config_count}
    - Note: If the partition count or total-run count differs from the number of entries
      in **Configuration Files in Scope** above, use the scope list as the source of
      truth for this request and briefly note the discrepancy.
    
    ### File Contents
    {config_files_content}
    
    ### Validation Tasks
    
    1. **Visible Syntax / Schema Follow-up**:
       - Use the injected file contents to confirm or explain syntax/schema issues that are
         already visible in the excerpt
       - For sequential slices, continuation chunks, truncated excerpts, or generated
         summaries, do **not** claim standalone syntax/schema validity or invalidity for
         the full file based on that partial evidence alone
       - Verify schema expectations only for keys and structures that are fully visible
         in the provided excerpt (e.g., `package.json` `name`/`version`, visible
         `tsconfig.json` `compilerOptions`)
       - Treat `tsconfig*.json`, `jsconfig*.json`, and `.vscode/*.json` as JSONC-capable
         configs when comments are visible; do not flag those comments as strict-JSON
         syntax errors
    
    2. **Security Analysis**:
       - ⚠️ CRITICAL: Check for exposed secrets (API keys, passwords, tokens)
       - Verify no hardcoded credentials in configuration files (e.g., `password: mysecret` in YAML)
       - Check file permissions recommendations (e.g., .env files should be 0600)
       - Flag insecure defaults (weak crypto, permissive CORS, debug mode in prod; e.g., `DEBUG=true` in `.env.production`)
       - Validate environment variable usage (use ${VAR} instead of hardcoding)
    
    3. **Consistency Checks**:
       - Cross-reference related configs only when both files are explicitly in scope
         and visible in **File Contents** (e.g., `engines.node` in package.json ↔ `.nvmrc`;
         `python_requires` ↔ `.python-version`)
       - If a related config is outside the current scope or unavailable in the visible
         excerpt, state that the cross-check is unavailable from this request instead of
         recommending review of that unseen file
       - Verify dependency versions match across lockfiles and manifests (e.g., `package.json` vs `package-lock.json`)
       - Check for conflicting settings (e.g., different ports in docker-compose.yml vs .env)
       - Ensure CI/CD configs match documented build commands (e.g., `npm run test:unit` in workflow matches a real script in package.json)
    
    4. **Best Practices** (apply checks appropriate for the detected tech stack: {tech_stack}):
       - Dependency version pinning (e.g., for package.json: prefer exact versions in `dependencies`, ranges only in `devDependencies`; semver ranges such as `^`, `~`, `x`, or inequalities are ranges, not pinned versions)
       - Environment-specific configs (dev/staging/prod separation; e.g., `.env` vs `.env.production`)
       - Docker multi-stage builds, layer optimization (e.g., copy only necessary files before `npm install`)
       - CI/CD caching strategies, artifact management (e.g., cache `node_modules` keyed on `package-lock.json` hash)
       - Configuration documentation (comments explaining non-obvious settings, e.g., why a timeout is set to a specific value)
    
     5. **Special Handling for AI Workflow Configs** (if applicable):
        - Validate ai_helpers.yaml structure (role_prefix + behavioral_guidelines pattern)
        - Check YAML anchor references are valid
        - Verify persona prompt completeness
        - Flag token inefficiency patterns (redundant text, missing anchors)
        - Ensure behavioral_guidelines usage for consistency
        - When `.workflow-config.yaml` is in scope, treat `workflow.steps` as the
          supported override surface for execution planning. Do not treat
